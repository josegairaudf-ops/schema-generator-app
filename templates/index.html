<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schema Generator - All Types</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 950px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .section { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; background: #fafafa; }
        .hidden { display: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .pick-grid { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 10px; margin-bottom: 10px; }
        label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        #jsonOutput { width: 100%; background: #222; color: #0f0; padding: 15px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Multi-Schema Generator</h1>

        <div class="section">
            <label>Select Schema Type:</label>
            <select id="schemaTypeSelect" onchange="toggleFields()">
                <option value="SportsEvent">Sports Event</option>
                <option value="FAQPage">FAQ Page</option>
                <option value="BlogPosting">Blog Posting</option>
                <option value="Review">Review</option>
            </select>
        </div>

        <form id="mainForm">
            <input type="hidden" name="schemaType" id="hiddenType" value="SportsEvent">

            <!-- SECCIÓN SPORTS (Visible por defecto) -->
            <div id="sportsFields">
                <div class="section">
                    <h2>Event & League</h2>
                    <select name="seSport" id="seSport" onchange="updateTeams()">
                        <option value="NFL">NFL</option>
                        <option value="NBA">NBA</option>
                        <option value="MLB">MLB</option>
                        <option value="NHL">NHL</option>
                        <option value="Other">Other Sports</option>
                    </select>

                    <div id="customSportFields" class="hidden">
                        <div class="grid">
                            <input type="text" name="seLeagueCustom" placeholder="Custom League">
                            <input type="text" name="seSportCustom" placeholder="Custom Sport">
                        </div>
                    </div>

                    <div class="grid">
                        <div>
                            <label>Home Team:</label>
                            <select name="seTeamA" id="seTeamA" onchange="syncName()"></select>
                            <input type="text" name="seTeamACustom" id="seTeamACustom" class="hidden" placeholder="Team A" oninput="syncName()">
                        </div>
                        <div>
                            <label>Away Team:</label>
                            <select name="seTeamB" id="seTeamB" onchange="syncName()"></select>
                            <input type="text" name="seTeamBCustom" id="seTeamBCustom" class="hidden" placeholder="Team B" oninput="syncName()">
                        </div>
                    </div>
                    <label>Event Name:</label>
                    <input type="text" name="seName" id="seName" placeholder="Auto-generated name">
                </div>

                <div class="section">
                    <h2>Location & Status</h2>
                    <div class="grid">
                        <input type="text" name="seStadium" placeholder="Stadium">
                        <input type="text" name="seCity" placeholder="City">
                        <input type="text" name="seRegion" placeholder="Region">
                        <input type="text" name="seCountry" value="USA">
                    </div>
                    <input type="datetime-local" name="seStartDate">
                </div>

                <div class="section">
                    <h2>Picks 1-7</h2>
                    {% for i in range(1, 8) %}
                    <div class="pick-grid">
                        <input type="text" name="pick{{i}}Name" placeholder="Pick {{i}}">
                        <input type="text" name="pick{{i}}Price" placeholder="Odds">
                        <input type="url" name="pick{{i}}Url" placeholder="URL">
                    </div>
                    {% endfor %}
                </div>
            </div>

            <!-- SECCIÓN FAQ -->
            <div id="faqFields" class="hidden">
                <div class="section">
                    <h2>FAQ Details</h2>
                    <input type="text" name="faqQuestion" placeholder="Question">
                    <textarea name="faqAnswer" placeholder="Answer"></textarea>
                </div>
            </div>

            <!-- SECCIÓN BLOG -->
            <div id="blogFields" class="hidden">
                <div class="section">
                    <h2>Blog Details</h2>
                    <input type="text" name="blogHeadline" placeholder="Headline">
                    <input type="datetime-local" name="blogDatePublished">
                    <input type="text" name="blogAuthor" placeholder="Author Name">
                </div>
            </div>

            <!-- SECCIÓN REVIEW -->
            <div id="reviewFields" class="hidden">
                <div class="section">
                    <h2>Review Details</h2>
                    <input type="text" name="reviewItem" placeholder="Item Name">
                    <input type="number" name="reviewRating" step="0.1" min="1" max="5" placeholder="Rating (1-5)">
                    <textarea name="reviewBody" placeholder="Review content..."></textarea>
                </div>
            </div>

            <button type="submit">Generate JSON-LD</button>
        </form>

        <div class="section">
            <textarea id="jsonOutput" rows="15" readonly></textarea>
        </div>
    </div>

    <script>
        const teams = {
            "NFL": ["Arizona Cardinals", "Atlanta Falcons", "Buffalo Bills", "Kansas City Chiefs", "Dallas Cowboys"], // Simplificado para el ejemplo
            "NBA": ["Lakers", "Celtics", "Warriors", "Bulls", "Nets"],
            "MLB": ["Yankees", "Dodgers", "Red Sox"],
            "NHL": ["Bruins", "Rangers", "Maple Leafs"]
        };

        function toggleFields() {
            const val = document.getElementById('schemaTypeSelect').value;
            document.getElementById('hiddenType').value = val;
            document.getElementById('sportsFields').classList.toggle('hidden', val !== 'SportsEvent');
            document.getElementById('faqFields').classList.toggle('hidden', val !== 'FAQPage');
            document.getElementById('blogFields').classList.toggle('hidden', val !== 'BlogPosting');
            document.getElementById('reviewFields').classList.toggle('hidden', val !== 'Review');
        }

        function updateTeams() {
            const league = document.getElementById('seSport').value;
            const isOther = league === 'Other';
            document.getElementById('customSportFields').classList.toggle('hidden', !isOther);
            document.getElementById('seTeamA').classList.toggle('hidden', isOther);
            document.getElementById('seTeamB').classList.toggle('hidden', isOther);
            document.getElementById('seTeamACustom').classList.toggle('hidden', !isOther);
            document.getElementById('seTeamBCustom').classList.toggle('hidden', !isOther);

            if (!isOther) {
                const list = teams[league] || [];
                const options = list.map(t => `<option value="${t}">${t}</option>`).join('');
                document.getElementById('seTeamA').innerHTML = options;
                document.getElementById('seTeamB').innerHTML = options;
            }
            syncName();
        }

        function syncName() {
            const league = document.getElementById('seSport').value;
            let a, b;
            if (league === 'Other') {
                a = document.getElementById('seTeamACustom').value;
                b = document.getElementById('seTeamBCustom').value;
            } else {
                a = document.getElementById('seTeamA').value;
                b = document.getElementById('seTeamB').value;
            }
            document.getElementById('seName').value = a && b ? `${a} vs ${b}` : "";
        }

        document.getElementById('mainForm').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('/generate_schema', { method: 'POST', body: new FormData(this) })
                .then(r => r.json())
                .then(data => document.getElementById('jsonOutput').value = JSON.stringify(data, null, 2));
        });

        // Inicializar
        updateTeams();
    </script>
</body>
</html>
