<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Schema Generator Pro</title>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .section { padding: 20px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 20px; background: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .pick-grid { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 10px; background: #f1f3f4; padding: 10px; border-radius: 5px; margin-bottom: 5px; }
        label { font-weight: 600; font-size: 13px; color: #555; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 6px; box-sizing: border-box; }
        
        /* CLASE CRÍTICA PARA OCULTAR SECCIONES */
        .hidden { display: none !important; }

        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background: #1557b0; }
        #jsonOutput { background: #202124; color: #81c995; font-family: 'Consolas', monospace; padding: 20px; border-radius: 8px; width: 100%; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Schema Tool Pro</h1>

    <div class="section" style="background: #e8f0fe; border: 1px solid var(--primary);">
        <label>Select Schema Type:</label>
        <select id="schemaTypeSelect" onchange="switchSchema()">
            <option value="SportsEvent">Sports Event (Betting Picks)</option>
            <option value="Parlay">Parlay (SGP & CGP)</option>
            <option value="FAQPage">FAQ Page</option>
            <option value="BlogPosting">Blog Posting</option>
            <option value="Review">Review</option>
        </select>
    </div>

    <form id="mainForm">
        <input type="hidden" name="schemaType" id="hiddenType" value="SportsEvent">

        <!-- SPORTS EVENT SECTION -->
        <div id="fields_SportsEvent">
            <div class="section">
                <h2>League & Teams</h2>
                <div class="grid">
                    <div>
                        <label>Sport/League:</label>
                        <select name="seSport" id="seSport" onchange="loadTeams()">
                            <option value="NFL">NFL</option>
                            <option value="NBA">NBA</option>
                            <option value="MLB">MLB</option>
                            <option value="NHL">NHL</option>
                            <option value="Other">Other (Custom)</option>
                        </select>
                    </div>
                    <div id="customL" class="hidden">
                        <label>Custom League & Sport:</label>
                        <div class="grid">
                            <input type="text" name="seLeagueCustom" placeholder="League">
                            <input type="text" name="seSportCustom" placeholder="Sport">
                        </div>
                    </div>
                </div>

                <div class="grid" style="margin-top:15px;">
                    <div>
                        <label>Home Team (Team A):</label>
                        <select name="seTeamA" id="seTeamA" onchange="autoFillVenue()"></select>
                        <input type="text" name="seTeamACustom" id="seTeamACustom" class="hidden" placeholder="Team A Name" oninput="updName()">
                    </div>
                    <div>
                        <label>Away Team (Team B):</label>
                        <select name="seTeamB" id="seTeamB" onchange="updName()"></select>
                        <input type="text" name="seTeamBCustom" id="seTeamBCustom" class="hidden" placeholder="Team B Name" oninput="updName()">
                    </div>
                </div>
                <label style="margin-top:15px;">Event Name:</label>
                <input type="text" name="seName" id="seName">
            </div>

            <div class="section">
                <h2>Venue, Status & SEO</h2>
                <div class="grid">
                    <input type="text" name="seStadium" id="seStadium" placeholder="Stadium">
                    <input type="text" name="seCity" id="seCity" placeholder="City">
                    <input type="text" name="seRegion" id="seRegion" placeholder="Region (CA, TX...)">
                    <input type="text" name="seCountry" id="seCountry" value="US">
                </div>
                <div class="grid" style="margin-top:10px;">
                    <input type="datetime-local" name="seStartDate" title="Start Date">
                    <input type="datetime-local" name="seEndDate" title="End Date">
                    <input type="datetime-local" name="seValidFrom" title="Valid From">
                </div>
                <input type="text" name="seOrganizer" value="BetUS" placeholder="Organizer">
                <textarea name="seDesc" placeholder="SEO Description..."></textarea>
                <input type="url" name="seImage" placeholder="Featured Image URL">
                
                <h3>Offers & Picks</h3>
                <div class="pick-grid" style="background:#e8f0fe">
                    <input type="text" name="seOfferName" placeholder="Main Market">
                    <input type="text" name="seOfferPrice" placeholder="Odds">
                    <input type="url" name="seOfferUrl" placeholder="URL">
                </div>
                {% for i in range(1, 8) %}
                <div class="pick-grid">
                    <input type="text" name="pick{{i}}Name" placeholder="Pick {{i}}">
                    <input type="text" name="pick{{i}}Price" placeholder="Odds">
                    <input type="url" name="pick{{i}}Url" placeholder="URL">
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- PARLAY SECTION -->
        <div id="fields_Parlay" class="hidden">
            <div class="section" style="background: #fff4e5; border: 1px solid #ff9800;">
                <h2>Parlay Global Details</h2>
                <div class="grid">
                    <input type="text" name="parlayName" placeholder="Parlay Title">
                    <input type="text" name="parlayTotalOdds" placeholder="Total Odds">
                    <input type="url" name="parlayUrl" placeholder="Betting URL">
                </div>
                <div class="grid" style="margin-top:10px;">
                    <input type="text" name="p_seStadium" id="p_seStadium" placeholder="Stadium (Venue)">
                    <input type="text" name="p_seCity" id="p_seCity" placeholder="City">
                    <input type="text" name="p_seRegion" id="p_seRegion" placeholder="Region">
                </div>
                <textarea name="parlayDesc" placeholder="Parlay Description..."></textarea>
            </div>
            <div class="section">
                <h2>Parlay Legs</h2>
                {% for i in range(1, 8) %}
                <div class="pick-grid">
                    <input type="text" name="pPick{{i}}Event" placeholder="Event Name">
                    <input type="text" name="pPick{{i}}Name" placeholder="Pick">
                    <input type="text" name="pPick{{i}}Price" placeholder="Odds">
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- FAQ, BLOG, REVIEW -->
        <div id="fields_FAQPage" class="hidden">
            <div class="section"><h2>FAQ</h2><input type="text" name="faqQ1" placeholder="Question"><textarea name="faqA1" placeholder="Answer"></textarea></div>
        </div>
        <div id="fields_BlogPosting" class="hidden">
            <div class="section"><h2>Blog</h2><input type="text" name="blogHeadline" placeholder="Headline"><input type="text" name="blogAuthor" placeholder="Author"><input type="url" name="blogUrl" placeholder="URL"></div>
        </div>
        <div id="fields_Review" class="hidden">
            <div class="section"><h2>Review</h2><input type="text" name="revItem" placeholder="Item"><input type="number" name="revValue" value="5"></div>
        </div>

        <!-- EL BOTÓN DEBE ESTAR ADENTRO DEL FORM -->
        <button type="submit">Generate Professional Schema</button>
    </form>

    <textarea id="jsonOutput" rows="20" readonly placeholder="The generated code will appear here..."></textarea>
    <button type="button" id="copyBtn" onclick="copyToClipboard()" style="background-color: #34a853; margin-top: 10px;">Copy Schema Code</button>
</div>

<script>
    const teamData = {
        "NFL": {
            "Dallas Cowboys": { stadium: "AT&T Stadium", city: "Arlington", region: "TX" },
            "Kansas City Chiefs": { stadium: "Arrowhead Stadium", city: "Kansas City", region: "MO" }
            // ... (Aquí va tu lista completa que ya tienes)
        }
    };

    function switchSchema() {
        const typeSelect = document.getElementById('schemaTypeSelect');
        const hiddenType = document.getElementById('hiddenType');
        const type = typeSelect.value;
        hiddenType.value = type;

        const schemas = ["SportsEvent", "FAQPage", "BlogPosting", "Review", "Parlay"];
        schemas.forEach(s => {
            const div = document.getElementById(`fields_${s}`);
            if (div) {
                div.classList.toggle('hidden', s !== type);
                div.style.display = (s === type) ? 'block' : 'none';
            }
        });
        if (type === 'SportsEvent') loadTeams();
    }

    function loadTeams() {
        const league = document.getElementById('seSport').value;
        const isOther = league === 'Other';
        document.getElementById('customL').classList.toggle('hidden', !isOther);
        
        const teamA = document.getElementById('seTeamA');
        const teamB = document.getElementById('seTeamB');
        if (teamA && teamB) {
            teamA.classList.toggle('hidden', isOther);
            teamB.classList.toggle('hidden', isOther);
            if (!isOther && teamData[league]) {
                const names = Object.keys(teamData[league]);
                const options = names.map(t => `<option value="${t}">${t}</option>`).join('');
                teamA.innerHTML = options;
                teamB.innerHTML = options;
            }
        }
        autoFillVenue();
    }

    function autoFillVenue() {
        const type = document.getElementById('schemaTypeSelect').value;
        if (type !== 'SportsEvent') return;

        const league = document.getElementById('seSport').value;
        const homeTeam = document.getElementById('seTeamA').value;

        if (league !== 'Other' && teamData[league] && teamData[league][homeTeam]) {
            const info = teamData[league][homeTeam];
            const setV = (id, val) => { const el = document.getElementById(id); if(el) el.value = val; };
            setV('seStadium', info.stadium);
            setV('seCity', info.city);
            setV('seRegion', info.region);
            setV('seCountry', "US");
        }
        updName();
    }

    function updName() {
        const type = document.getElementById('schemaTypeSelect').value;
        if (type !== 'SportsEvent') return;
        const league = document.getElementById('seSport').value;
        const a = (league === 'Other') ? document.getElementById('seTeamACustom').value : document.getElementById('seTeamA').value;
        const b = (league === 'Other') ? document.getElementById('seTeamBCustom').value : document.getElementById('seTeamB').value;
        const nameField = document.getElementById('seName');
        if (nameField) nameField.value = a && b ? `${a} vs ${b}` : "";
    }

    document.getElementById('mainForm').onsubmit = async (e) => {
        e.preventDefault();
        const output = document.getElementById('jsonOutput');
        output.value = "Generating... Please wait.";
        try {
            const res = await fetch('/generate_schema', { method: 'POST', body: new FormData(e.target) });
            const json = await res.json();
            output.value = `<script type="application/ld+json">\n${JSON.stringify(json, null, 2)}\n<\/script>`;
        } catch (err) {
            output.value = "Error connecting to server.";
        }
    };

    function copyToClipboard() {
        const copyText = document.getElementById("jsonOutput");
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        document.getElementById("copyBtn").innerText = "Copied! ✅";
        setTimeout(() => { document.getElementById("copyBtn").innerText = "Copy Schema Code"; }, 2000);
    }

    window.onload = switchSchema;
</script>
</body>
</html>
