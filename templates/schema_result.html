<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Generated Schema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        pre {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            padding: 1em;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 600px;
            overflow-y: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4 text-center">Generated Schema JSON</h1>
    <pre id="schemaJson">{{ schema | tojson(indent=2) }}</pre>
    <div class="text-center mt-3">
        <button id="copyBtn" class="btn btn-success mb-2">Copy to Clipboard</button>
    </div>
    <div class="text-center mt-2">
        <a href="/" class="btn btn-primary">Back to Generator</a>
    </div>
</div>

<script>
document.getElementById("copyBtn").addEventListener("click", function() {
    const jsonText = document.getElementById("schemaJson").innerText;
    navigator.clipboard.writeText(jsonText).then(() => {
        alert("JSON schema copied to clipboard!");
    }).catch(err => {
        alert("Failed to copy text: ", err);
    });
});
</script>

</body>
</html>
