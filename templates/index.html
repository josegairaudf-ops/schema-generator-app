<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Schema.org Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
  #schemaForm > .btn-primary {
    display: block !important;
  }
  #schemaForm > .mt-3 {
    display: block !important;
  }
</style>
</head>
<body class="bg-light">
<div class="container mt-5 mb-5">
    <h1 class="mb-4">Schema.org Generator</h1>
    <form id="schemaForm" autocomplete="off">
        <div class="mb-3">
            <label for="schemaType" class="form-label">Select Schema Type:</label>
            <select id="schemaType" name="schemaType" class="form-select">
                <option value="FAQPage">FAQPage</option>
                <option value="BlogPosting">BlogPosting</option>
                <option value="Review">Review</option>
                <option value="SportsEvent">SportsEvent</option>
            </select>
        </div>
        <!-- FAQ Fields -->
        <div id="faqFields" class="schema-fields">
            <h2 class="mb-3">FAQPage Schema Fields</h2>
            <div class="mb-2">
                <label for="faqAuthor" class="form-label">Author:</label>
                <input type="text" class="form-control" id="faqAuthor" name="faqAuthor" value="Anonymous">
            </div>
            <div class="mb-2">
                <label for="faqCreatedAt" class="form-label">Creation Date & Time:</label>
                <input type="datetime-local" class="form-control" id="faqCreatedAt" name="faqCreatedAt">
            </div>
            <div class="mb-2">
                <label for="faqModifiedAt" class="form-label">Modification Date & Time:</label>
                <input type="datetime-local" class="form-control" id="faqModifiedAt" name="faqModifiedAt">
            </div>
            <div class="mb-2">
                <label for="faqQ1">FAQ Question 1</label>
                <input type="text" class="form-control" id="faqQ1" name="faqQ1">
                <label for="faqA1">FAQ Answer 1</label>
                <textarea rows="2" class="form-control" id="faqA1" name="faqA1"></textarea>
            </div>
            <div class="mb-2">
                <label for="faqQ2">FAQ Question 2</label>
                <input type="text" class="form-control" id="faqQ2" name="faqQ2">
                <label for="faqA2">FAQ Answer 2</label>
                <textarea rows="2" class="form-control" id="faqA2" name="faqA2"></textarea>
            </div>
            <div class="mb-2">
                <label for="faqQ3">FAQ Question 3</label>
                <input type="text" class="form-control" id="faqQ3" name="faqQ3">
                <label for="faqA3">FAQ Answer 3</label>
                <textarea rows="2" class="form-control" id="faqA3" name="faqA3"></textarea>
            </div>
            <div class="mb-2">
                <label for="faqQ4">FAQ Question 4</label>
                <input type="text" class="form-control" id="faqQ4" name="faqQ4">
                <label for="faqA4">FAQ Answer 4</label>
                <textarea rows="2" class="form-control" id="faqA4" name="faqA4"></textarea>
            </div>
        </div>

        <!-- Blog Fields -->
       <div id="blogFields" class="schema-fields" style="display:none;">
    <h2 class="mb-3">BlogPosting Schema Fields</h2>
    <div class="mb-2">
        <label for="blogTitle" class="form-label">Title:</label>
        <input type="text" class="form-control" id="blogTitle" name="blogTitle">
    </div>
    <div class="mb-2">
        <label for="blogDescription" class="form-label">Description:</label>
        <input type="text" class="form-control" id="blogDescription" name="blogDescription">
    </div>
    <div class="mb-2">
        <label for="blogUrl" class="form-label">URL:</label>
        <input type="text" class="form-control" id="blogUrl" name="blogUrl">
    </div>
    <div class="mb-2">
        <label for="blogAuthor" class="form-label">Author:</label>
        <select class="form-select" id="blogAuthor" name="blogAuthor">
            <option value="">Select author</option>
            <!-- Opciones se agregan por JavaScript -->
        </select>
        <input type="hidden" id="blogAuthorUrl" name="blogAuthorUrl">
    </div>
    <div class="mb-2">
        <label for="blogPublicationDate" class="form-label">Publication Date:</label>
        <input type="date" class="form-control" id="blogPublicationDate" name="blogPublicationDate">
    </div>
    <div class="mb-2">
        <label for="blogModifiedDate" class="form-label">Modified Date:</label>
        <input type="date" class="form-control" id="blogModifiedDate" name="blogModifiedDate">
    </div>
    <div class="mb-2">
        <label for="blogImage" class="form-label">Image URL:</label>
        <input type="text" class="form-control" id="blogImage" name="blogImage">
    </div>
    <div class="mb-2">
        <label for="blogPublisherName" class="form-label">Publisher Name:</label>
        <input type="text" class="form-control" id="blogPublisherName" name="blogPublisherName">
    </div>
    <div class="mb-2">
        <label for="blogPublisherLogo" class="form-label">Publisher Logo URL:</label>
        <input type="text" class="form-control" id="blogPublisherLogo" name="blogPublisherLogo">
    </div>
    <div class="mb-2">
        <label for="blogLanguage" class="form-label">Language:</label>
        <input type="text" class="form-control" id="blogLanguage" name="blogLanguage" value="en">
    </div>
    <div class="mb-2">
        <label for="blogKeywords" class="form-label">Keywords (comma separated):</label>
        <input type="text" class="form-control" id="blogKeywords" name="blogKeywords">
    </div>
    <div class="mb-2">
        <label for="blogWordCount" class="form-label">Word Count:</label>
        <input type="number" class="form-control" id="blogWordCount" name="blogWordCount" min="0">
    </div>
    <div class="mb-2">
        <label for="blogContent" class="form-label">Content:</label>
        <textarea rows="4" class="form-control" id="blogContent" name="blogContent"></textarea>
    </div>
</div>
        <!-- Review Fields -->
        <div id="reviewFields" class="schema-fields" style="display:none;">
            <h2 class="mb-3">Review Schema Fields</h2>
            <div class="mb-2">
                <label for="reviewAuthor" class="form-label">Author:</label>
                <input type="text" class="form-control" id="reviewAuthor" name="reviewAuthor">
            </div>
            <div class="mb-2">
                <label for="reviewPublicationDate" class="form-label">Publication Date:</label>
                <input type="date" class="form-control" id="reviewPublicationDate" name="reviewPublicationDate">
            </div>
            <div class="mb-2">
                <label for="reviewReasoning" class="form-label">Review Body:</label>
                <textarea rows="3" class="form-control" id="reviewReasoning" name="reviewReasoning"></textarea>
            </div>
            <div class="mb-2">
                <label for="reviewRating" class="form-label">Rating (1-5):</label>
                <input type="number" class="form-control" id="reviewRating" name="reviewRating" min="1" max="5">
            </div>
            <div class="mb-2">
                <label for="reviewEventName" class="form-label">Event Name:</label>
                <input type="text" class="form-control" id="reviewEventName" name="reviewEventName">
            </div>
            <div class="mb-2">
                <label for="reviewEventDate" class="form-label">Event Date:</label>
                <input type="date" class="form-control" id="reviewEventDate" name="reviewEventDate">
            </div>
            <div class="mb-2">
                <label for="reviewEventLocation" class="form-label">Event Location:</label>
                <input type="text" class="form-control" id="reviewEventLocation" name="reviewEventLocation">
            </div>
            <div class="mb-2">
                <label for="reviewMarketType" class="form-label">Market Type:</label>
                <input type="text" class="form-control" id="reviewMarketType" name="reviewMarketType">
            </div>
            <div class="mb-2">
                <label for="reviewSelection" class="form-label">Selection:</label>
                <input type="text" class="form-control" id="reviewSelection" name="reviewSelection">
            </div>
            <div class="mb-2">
                <label for="reviewOdds" class="form-label">Odds:</label>
                <input type="text" class="form-control" id="reviewOdds" name="reviewOdds">
            </div>
            <div class="mb-2">
                <label for="reviewBookmaker" class="form-label">Bookmaker:</label>
                <input type="text" class="form-control" id="reviewBookmaker" name="reviewBookmaker">
            </div>
            <div class="mb-2">
                <label for="reviewUnits" class="form-label">Units/Risk:</label>
                <input type="text" class="form-control" id="reviewUnits" name="reviewUnits">
            </div>
        </div>
    <div id="sportsEventFields" class="schema-fields" style="display:none;">
        <h2 class="mb-3">SportsEvent Schema Fields</h2>
        <!-- Datos generales del evento -->
    <div class="mb-2">
        <label for="seName" class="form-label">Event Name (Team A vs Team B):</label>
        <input type="text" class="form-control" id="seName" name="seName">
    </div>
    <div class="mb-2">
        <label for="seSport" class="form-label">Sport:</label>
        <input type="text" class="form-control" id="seSport" name="seSport" placeholder="American Football, NBA, Soccer...">
    </div>
    <div class="mb-2">
        <label for="seStartDate" class="form-label">Start Date & Time:</label>
        <input type="datetime-local" class="form-control" id="seStartDate" name="seStartDate">
    </div>
    <div class="mb-2">
        <label for="seEndDate" class="form-label">End Date & Time:</label>
        <input type="datetime-local" class="form-control" id="seEndDate" name="seEndDate">
    </div>

    <!-- Location -->
    <div class="mb-2">
        <label for="seStadium" class="form-label">Stadium Name:</label>
        <input type="text" class="form-control" id="seStadium" name="seStadium">
    </div>
    <div class="mb-2">
        <label for="seCity" class="form-label">City:</label>
        <input type="text" class="form-control" id="seCity" name="seCity">
    </div>
    <div class="mb-2">
        <label for="seRegion" class="form-label">State/Region:</label>
        <input type="text" class="form-control" id="seRegion" name="seRegion">
    </div>
    <div class="mb-2">
        <label for="seCountry" class="form-label">Country Code:</label>
        <input type="text" class="form-control" id="seCountry" name="seCountry" value="US">
    </div>

    <!-- Equipos / performers -->
    <div class="mb-2">
        <label for="seTeamA" class="form-label">Team A (Home):</label>
        <input type="text" class="form-control" id="seTeamA" name="seTeamA">
    </div>
    <div class="mb-2">
        <label for="seTeamB" class="form-label">Team B (Away):</label>
        <input type="text" class="form-control" id="seTeamB" name="seTeamB">
    </div>
    <div class="mb-2">
        <label for="seKeyPlayer" class="form-label">Key Player (optional):</label>
        <input type="text" class="form-control" id="seKeyPlayer" name="seKeyPlayer">
    </div>

    <!-- Meta del artículo / imagen -->
    <div class="mb-2">
        <label for="seUrl" class="form-label">Article URL:</label>
        <input type="text" class="form-control" id="seUrl" name="seUrl">
    </div>
    <div class="mb-2">
        <label for="seImage" class="form-label">Featured Image URL:</label>
        <input type="text" class="form-control" id="seImage" name="seImage">
    </div>
    <div class="mb-2">
        <label for="seDescription" class="form-label">Description (SEO betting summary):</label>
        <textarea class="form-control" id="seDescription" name="seDescription" rows="3"></textarea>
    </div>
            <!-- Estado del evento y modo de asistencia -->
    <div class="mb-2">
        <label for="seEventStatus" class="form-label">Event Status:</label>
        <select class="form-select" id="seEventStatus" name="seEventStatus">
            <option value="https://schema.org/EventScheduled">Scheduled</option>
            <option value="https://schema.org/EventPostponed">Postponed</option>
            <option value="https://schema.org/EventCancelled">Cancelled</option>
            <option value="https://schema.org/EventRescheduled">Rescheduled</option>
        </select>
    </div>
    <div class="mb-2">
        <label for="seAttendanceMode" class="form-label">Attendance Mode:</label>
        <select class="form-select" id="seAttendanceMode" name="seAttendanceMode">
            <option value="https://schema.org/OfflineEventAttendanceMode">Offline</option>
            <option value="https://schema.org/OnlineEventAttendanceMode">Online</option>
            <option value="https://schema.org/MixedEventAttendanceMode">Mixed</option>
        </select>
    </div>

    <!-- Idioma y accesibilidad -->
    <div class="mb-2">
        <label for="seLanguage" class="form-label">Language:</label>
        <input type="text" class="form-control" id="seLanguage" name="seLanguage" value="en-US">
    </div>
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="seFree" name="seFree" checked>
        <label class="form-check-label" for="seFree">
            Is Accessible For Free
        </label>
    </div>

    <!-- Main pick / Offer -->
    <h3 class="mt-3 mb-2">Main Pick Offer</h3>
    <div class="mb-2">
        <label for="seOfferName" class="form-label">Pick Name:</label>
        <input type="text" class="form-control" id="seOfferName" name="seOfferName" placeholder="Chiefs -3.5 vs Cowboys">
    </div>
    <div class="mb-2">
        <label for="seOfferPrice" class="form-label">Odds (Price):</label>
        <input type="text" class="form-control" id="seOfferPrice" name="seOfferPrice" placeholder="-110">
    </div>
    <div class="mb-2">
        <label for="seOfferUrl" class="form-label">Sportsbook Event URL:</label>
        <input type="text" class="form-control" id="seOfferUrl" name="seOfferUrl">
    </div>
<div id="sportsEventFields" class="schema-fields" style="display:none;">
    <h2 class="mb-3">SportsEvent Schema Fields</h2>
    <!-- ... TODOS los campos seName, seSport, etc ... -->
</div> <!-- cierra SOLO #sportsEventFields -->

<button type="submit" class="btn btn-primary w-100 mt-3">Generate Schema</button>

<div class="mt-3">
    <label for="generatedSchema" class="form-label">Generated Schema.org JSON-LD:</label>
    <textarea readonly class="form-control" id="generatedSchema" rows="10"></textarea>

    <div class="form-check mt-2">
        <input class="form-check-input" type="checkbox" id="wrapScript" name="wrapScript">
        <label class="form-check-label" for="wrapScript">
            Include Script Tags &lt;script type="application/ld+json"&gt;
        </label>
    </div>

    <button type="button" class="btn btn-success mt-2 w-100" id="copySchemaBtn">Copy Schema</button>
    <span id="copyMsg" class="text-success small d-none">Done!</span>
</div>

</form>
</div> <!-- este es el cierre del .container -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // --- Cambio de tipo de schema ---
    const schemaTypeSelect = document.getElementById('schemaType');
const faqFields = document.getElementById('faqFields');
const blogFields = document.getElementById('blogFields');
const reviewFields = document.getElementById('reviewFields');
const sportsEventFields = document.getElementById('sportsEventFields');

    function updateSchemaFields() {
    const selected = schemaTypeSelect.value;
    faqFields.style.display = (selected === 'FAQPage') ? '' : 'none';
    blogFields.style.display = (selected === 'BlogPosting') ? '' : 'none';
    reviewFields.style.display = (selected === 'Review') ? '' : 'none';
    sportsEventFields.style.display = (selected === 'SportsEvent') ? '' : 'none';
}
    schemaTypeSelect.addEventListener('change', updateSchemaFields);
    updateSchemaFields(); // Inicializa al cargar

    // --- Submit del formulario ---
    const form = document.getElementById('schemaForm');
    const outputTextarea = document.getElementById('generatedSchema');
    const wrapCheckbox = document.getElementById('wrapScript');

    form.addEventListener('submit', async function(e){
        e.preventDefault();
        let formData = {};
        new FormData(form).forEach((v, k) => {formData[k] = v;});
        console.log("Form Data:", formData);
        const endpoint = '/generate_schema';
        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                body: new URLSearchParams(formData)
            });
            const schemaData = await response.json();
            let output = JSON.stringify(schemaData, null, 2);

            if (wrapCheckbox.checked) {
                output = '<script type="application/ld+json">\n' + output + '\n<\/script>';
            }

            outputTextarea.value = output;
        } catch (err) {
            outputTextarea.value = "Error generating schema";
        }
    });

    // --- Copiar Schema ---
    const copyBtn = document.getElementById('copySchemaBtn');
    const copyMsg = document.getElementById('copyMsg');

    copyBtn.addEventListener('click', function() {
        outputTextarea.select();
        outputTextarea.setSelectionRange(0, 99999); // Para móviles
        document.execCommand('copy');
        copyMsg.classList.remove('d-none');
        setTimeout(() => { copyMsg.classList.add('d-none'); }, 1200);
    });

    // --- Autores y URLs ---
    const authors = {
        "Alex Campean": "https://www.betus.com.pa/author/campean/",
        "Austin Boyd": "https://www.betus.com.pa/author/boyd/",
        "Daniel Saenz (Daniels)": "https://www.betus.com.pa/author/daniels",
        "Daryl Curnow": "https://www.betus.com.pa/author/daryl-curnow/",
        "Dave Manyun (Manyun)": "https://www.betus.com.pa/author/manyun/",
        "Javier Zuniga (Zack Robinson)": "https://www.betus.com.pa/author/zack-robinson/",
        "Jim Fuller": "https://www.betus.com.pa/author/jim/",
        "Jon Adams": "https://www.betus.com.pa/author/jonadams/",
        "Jose Rhodin": "https://www.betus.com.pa/author/joserohdin/",
        "Mark Pukalo": "https://www.betus.com.pa/author/mark/",
        "Mark Rich": "https://www.betus.com.pa/author/mark-rich/",
        "Oscar Diaz": "https://www.betus.com.pa/author/oscar-diaz/",
        "Paolo Go": "https://www.betus.com.pa/author/paolo/",
        "Patrick Gustavson (LR staff)": "https://www.betus.com.pa/author/patrick-gustavson/",
        "Tom Viera": "https://www.betus.com.pa/author/viera/",
        "Tony Lee (LR staff)": "https://www.betus.com.pa/author/tony-lee/",
        "Zach Lowy": "https://www.betus.com.pa/author/lowy/",
        "Jeremy Block": "https://www.betus.com.pa/author/jeremy-",
        "Eric Williams": "https://www.betus.com.pa/author/eric-williams/",
        "EZ Ryder": "https://www.betus.com.pa/author/ez/",
        "Scott Kacsmar": "https://www.betus.com.pa/author/scott-kacsmar/",
        "Bryan Bejarano": "https://www.betus.com.pa/author/bryanbejarano/",
        "Kelsey Kramer": "https://www.betus.com.pa/author/kramer/",
        "Perry Petty": "https://www.betus.com.pa/author/petty/",
        "Jamie Johnson": "https://www.betus.com.pa/author/jamie/",
        "Lola": "https://www.betus.com.pa/author/lola/",
        "Lone Ranger": "https://www.betus.com.pa/author/lone-ranger/",
        "Donald Norton": "https://www.betus.com.pa/author/donald-norton/"
    };

    const authorSelect = document.getElementById("blogAuthor");
    const authorUrlInput = document.getElementById("blogAuthorUrl");

    Object.keys(authors).forEach(author => {
        const option = document.createElement("option");
        option.value = author;
        option.textContent = author;
        authorSelect.appendChild(option);
    });

    authorSelect.addEventListener("change", function() {
        authorUrlInput.value = authors[this.value] || "";
    });
});
</script>
</body>
</html>
