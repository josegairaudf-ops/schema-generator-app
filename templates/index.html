<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schema.org Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .hidden-fields {
            display: none;
        }
        #generatedSchemaOutput {
            white-space: pre-wrap;
            word-wrap: break-word;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 5px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4 text-center">Schema.org Generator</h1>

    <form id="schemaGeneratorForm" method="POST" action="/generate_schema">

        <div class="mb-3">
            <label for="schemaType" class="form-label">Select Schema Type:</label>
            <select class="form-select" id="schemaType" name="schemaType" required>
                <option value="">-- Please Select --</option>
                <option value="FAQPage">FAQPage</option>
                <option value="BlogPosting">BlogPosting</option>
                <option value="Review">Review (Betting Picks)</option>
            </select>
        </div>

        <div id="faqPageFields" class="schema-fields hidden-fields">
            <h2 class="mt-4 mb-3">FAQPage Schema Fields</h2>
            <div class="mb-3">
                <label for="faqAuthor" class="form-label">Author:</label>
                <input type="text" class="form-control" id="faqAuthor" name="faqAuthor" placeholder="e.g., John Doe" required />
            </div>
            <div class="mb-3">
                <label for="faqCreatedAt" class="form-label">Creation Date & Time:</label>
                <input type="datetime-local" class="form-control" id="faqCreatedAt" name="faqCreatedAt" required />
            </div>
            <div class="mb-3">
                <label for="faqModifiedAt" class="form-label">Modification Date & Time:</label>
                <input type="datetime-local" class="form-control" id="faqModifiedAt" name="faqModifiedAt" required />
            </div>
            <div class="mb-3">
                <label for="faqQ1" class="form-label">Question 1:</label>
                <input type="text" class="form-control" id="faqQ1" name="faqQ1" placeholder="e.g., What is Schema.org?" required />
            </div>
            <div class="mb-3">
                <label for="faqA1" class="form-label">Answer 1:</label>
                <textarea class="form-control" id="faqA1" name="faqA1" rows="3" placeholder="e.g., Schema.org is a collaborative... " required></textarea>
            </div>
            <div class="mb-3">
                <label for="faqQ2" class="form-label">Question 2:</label>
                <input type="text" class="form-control" id="faqQ2" name="faqQ2" placeholder="e.g., How do I implement Schema.org?" />
            </div>
            <div class="mb-3">
                <label for="faqA2" class="form-label">Answer 2:</label>
                <textarea class="form-control" id="faqA2" name="faqA2" rows="3" placeholder="e.g., You can implement Schema.org by adding..." ></textarea>
            </div>
            <!-- Additional FAQs optional -->
        </div>

        <div id="blogPostingFields" class="schema-fields hidden-fields">
            <h2 class="mt-4 mb-3">BlogPosting Schema Fields</h2>
            <div class="mb-3">
                <label for="blogTitle" class="form-label">Title:</label>
                <input type="text" class="form-control" id="blogTitle" name="blogTitle" placeholder="e.g., The Future of Web Development" required />
            </div>
            <div class="mb-3">
                <label for="blogAuthor" class="form-label">Author:</label>
                <input type="text" class="form-control" id="blogAuthor" name="blogAuthor" placeholder="e.g., Jane Doe" required />
            </div>
            <div class="mb-3">
                <label for="blogPublicationDate" class="form-label">Publication Date:</label>
                <input type="date" class="form-control" id="blogPublicationDate" name="blogPublicationDate" required />
            </div>
            <div class="mb-3">
                <label for="blogImage" class="form-label">Image URL:</label>
                <input type="url" class="form-control" id="blogImage" name="blogImage" placeholder="https://example.com/image.jpg" />
            </div>
            <div class="mb-3">
                <label for="blogContent" class="form-label">Content:</label>
                <textarea class="form-control" id="blogContent" name="blogContent" rows="5" placeholder="Sample blog content..."></textarea>
            </div>
            <h3 class="mt-4 mb-3">Sport Event Details (Optional)</h3>
            <div class="mb-3">
                <label for="eventName" class="form-label">Event Name:</label>
                <input type="text" class="form-control" id="eventName" name="eventName" placeholder="World Cup Final" />
            </div>
            <div class="mb-3">
                <label for="eventStartDate" class="form-label">Event Start Date:</label>
                <input type="datetime-local" class="form-control" id="eventStartDate" name="eventStartDate" />
            </div>
            <div class="mb-3">
                <label for="eventEndDate" class="form-label">Event End Date:</label>
                <input type="datetime-local" class="form-control" id="eventEndDate" name="eventEndDate" />
            </div>
            <div class="mb-3">
                <label for="eventLocation" class="form-label">Location:</label>
                <input type="text" class="form-control" id="eventLocation" name="eventLocation" placeholder="e.g., Wembley Stadium" />
            </div>
            <div class="mb-3">
                <label for="eventOrganizer" class="form-label">Organizer:</label>
                <input type="text" class="form-control" id="eventOrganizer" name="eventOrganizer" placeholder="e.g., FIFA" />
            </div>
            <div class="mb-3">
                <label for="eventDescription" class="form-label">Event Description:</label>
                <textarea class="form-control" id="eventDescription" name="eventDescription" rows="3" placeholder="e.g., The highly anticipated final match..."></textarea>
            </div>
            <div class="mb-3">
                <label for="eventStatus" class="form-label">Event Status:</label>
                <select class="form-select" id="eventStatus" name="eventStatus">
                    <option value="">-- Select Status --</option>
                    <option value="EventScheduled">Scheduled</option>
                    <option value="EventCancelled">Cancelled</option>
                    <option value="EventPostponed">Postponed</option>
                    <option value="EventRescheduled">Rescheduled</option>
                    <option value="EventMovedOnline">Moved Online</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="eventImage" class="form-label">Event Image URL:</label>
                <input type="url" class="form-control" id="eventImage" name="eventImage" placeholder="https://example.com/image.jpg" />
            </div>
            <div class="mb-3">
                <label for="eventOffers" class="form-label">Offers (Tickets URL):</label>
                <input type="url" class="form-control" id="eventOffers" name="eventOffers" placeholder="https://example.com/tickets" />
            </div>
            <div class="mb-3">
                <label for="eventTeam1" class="form-label">Team 1:</label>
                <input type="text" class="form-control" id="eventTeam1" name="eventTeam1" placeholder="e.g., Argentina National Football Team" />
            </div>
            <div class="mb-3">
                <label for="eventTeam2" class="form-label">Team 2:</label>
                <input type="text" class="form-control" id="eventTeam2" name="eventTeam2" placeholder="e.g., France National Football Team" />
            </div>
        </div>

        <div id="reviewFields" class="schema-fields hidden-fields">
            <h2 class="mt-4 mb-3">Review Schema Fields (Betting Picks)</h2>
            <div class="mb-3">
                <label for="reviewAuthor" class="form-label">Author:</label>
                <input type="text" class="form-control" id="reviewAuthor" name="reviewAuthor" placeholder="e.g., BettingExpert" required />
            </div>
            <div class="mb-3">
                <label for="reviewPublicationDate" class="form-label">Publication Date:</label>
                <input type="date" class="form-control" id="reviewPublicationDate" name="reviewPublicationDate" required />
            </div>
            <div class="mb-3">
                <label for="reviewReasoning" class="form-label">Analysis / Reasoning:</label>
                <textarea class="form-control" id="reviewReasoning" name="reviewReasoning" rows="4" placeholder="e.g., My analysis shows that Team A has a stronger offense..." required></textarea>
            </div>
            <div class="mb-3">
                <label for="reviewRating" class="form-label">Rating / Confidence (1-5):</label>
                <input type="number" class="form-control" id="reviewRating" name="reviewRating" min="1" max="5" placeholder="e.g., 4" />
            </div>
            <div class="mb-3">
                <label for="reviewEventName" class="form-label">Event Name:</label>
                <input type="text" class="form-control" id="reviewEventName" name="reviewEventName" placeholder="e.g., NBA Regular Season Match" />
            </div>
            <div class="mb-3">
                <label for="reviewEventDate" class="form-label">Event Date:</label>
                <input type="date" class="form-control" id="reviewEventDate" name="reviewEventDate" />
            </div>
            <div class="mb-3">
                <label for="reviewEventLocation" class="form-label">Event Location:</label>
                <input type="text" class="form-control" id="reviewEventLocation" name="reviewEventLocation" placeholder="e.g., Staples Center" />
            </div>
            <div class="mb-3">
                <label for="reviewMarketType" class="form-label">Market Type:</label>
                <input type="text" class="form-control" id="reviewMarketType" name="reviewMarketType" placeholder="e.g., Moneyline, Spread, Over/Under, Prop" />
            </div>
            <div class="mb-3">
                <label for="reviewSelection" class="form-label">Selection:</label>
                <input type="text" class="form-control" id="reviewSelection" name="reviewSelection" placeholder="e.g., Los Angeles Lakers to Win" />
            </div>
            <div class="mb-3">
                <label for="reviewOdds" class="form-label">Odds / Quote:</label>
                <input type="text" class="form-control" id="reviewOdds" name="reviewOdds" placeholder="e.g., 1.85, -110" />
            </div>
            <div class="mb-3">
                <label for="reviewBookmaker" class="form-label">Bookmaker:</label>
                <input type="text" class="form-control" id="reviewBookmaker" name="reviewBookmaker" placeholder="e.g., Bet365" />
            </div>
            <div class="mb-3">
                <label for="reviewUnits" class="form-label">Units / Risk:</label>
                <input type="number" class="form-control" id="reviewUnits" name="reviewUnits" step="0.5" placeholder="e.g., 2" />
            </div>
        </div>

        <div class="d-grid gap-2 mt-5">
            <button type="submit" class="btn btn-primary btn-lg" id="generateSchemaBtn">Generate Schema</button>
        </div>
    </form>

    <div class="mt-5">
        <h3>Generated Schema.org JSON-LD:</h3>
        <div class="mb-2">
            <button id="copyBtn" class="btn btn-success mb-2">Copy to Clipboard</button>
            <span id="copyFeedback" style="display:none; color:green; margin-left:10px;">Copied!</span>
        </div>
        <pre id="generatedSchemaOutput"></pre>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const schemaTypeSelect = document.getElementById('schemaType');
    const faqPageFields = document.getElementById('faqPageFields');
    const blogPostingFields = document.getElementById('blogPostingFields');
    const reviewFields = document.getElementById('reviewFields');
    const schemaGeneratorForm = document.getElementById('schemaGeneratorForm');
    const generatedSchemaOutput = document.getElementById('generatedSchemaOutput');

    function toggleSchemaFields() {
        const selectedType = schemaTypeSelect.value;

        faqPageFields.classList.add('hidden-fields');
        blogPostingFields.classList.add('hidden-fields');
        reviewFields.classList.add('hidden-fields');

        if (selectedType === 'FAQPage') {
            faqPageFields.classList.remove('hidden-fields');
        } else if (selectedType === 'BlogPosting') {
            blogPostingFields.classList.remove('hidden-fields');
        } else if (selectedType === 'Review') {
            reviewFields.classList.remove('hidden-fields');
        }

        localStorage.setItem('selectedSchemaType', selectedType);
    }

    schemaTypeSelect.addEventListener('change', toggleSchemaFields);

    const savedSelectedType = localStorage.getItem('selectedSchemaType');
    if (savedSelectedType) {
        schemaTypeSelect.value = savedSelectedType;
    }

    toggleSchemaFields();

    schemaGeneratorForm.addEventListener('submit', async function (e) {
        e.preventDefault();

        const formData = new FormData(schemaGeneratorForm);
        const response = await fetch('/generate_schema', {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            const schema = await response.json();
            generatedSchemaOutput.textContent = JSON.stringify(schema, null, 2);
        } else {
            const error = await response.json();
            generatedSchemaOutput.textContent = `Error: ${error.error || 'Something went wrong'}`;
        }
    });
});

document.getElementById("copyBtn").addEventListener("click", function () {
    const jsonText = document.getElementById("generatedSchemaOutput").innerText;

    navigator.clipboard.writeText(jsonText).then(() => {
        document.getElementById('copyFeedback').style.display = 'inline';
        setTimeout(function () {
            document.getElementById('copyFeedback').style.display = 'none';
        }, 1500);
    }).catch(err => {
        alert("Could not copy (your browser may restrict clipboard access).");
    });
});

document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('schemaGeneratorForm');

    form.addEventListener('submit', function (e) {
        const tipo = document.getElementById('schemaType').value;
        let valid = true;
        let missingFields = [];

        if (tipo === 'FAQPage') {
            if (!document.getElementById('faqQ1').value.trim()) {
                valid = false;
                missingFields.push('Question 1');
            }
            if (!document.getElementById('faqA1').value.trim()) {
                valid = false;
                missingFields.push('Answer 1');
            }
            if (!document.getElementById('faqAuthor').value.trim()) {
                valid = false;
                missingFields.push('Author');
            }
            if (!document.getElementById('faqCreatedAt').value.trim()) {
                valid = false;
                missingFields.push('Creation Date & Time');
            }
            if (!document.getElementById('faqModifiedAt').value.trim()) {
                valid = false;
                missingFields.push('Modification Date & Time');
            }
        } else if (tipo === 'BlogPosting') {
            if (!document.getElementById('blogTitle').value.trim()) {
                valid = false;
                missingFields.push('Blog Title');
            }
            if (!document.getElementById('blogAuthor').value.trim()) {
                valid = false;
                missingFields.push('Author');
            }
            if (!document.getElementById('blogPublicationDate').value.trim()) {
                valid = false;
                missingFields.push('Publication Date');
            }
        } else if (tipo === 'Review') {
            if (!document.getElementById('reviewAuthor').value.trim()) {
                valid = false;
                missingFields.push('Author');
            }
            if (!document.getElementById('reviewReasoning').value.trim()) {
                valid = false;
                missingFields.push('Analysis / Reasoning');
            }
            if (!document.getElementById('reviewPublicationDate').value.trim()) {
                valid = false;
                missingFields.push('Publication Date');
            }
        }

        if (!valid) {
            e.preventDefault();
            alert('Please fill in the following required fields:\n' + missingFields.join('\n'));
        }
    });
});
</script>
</body>
</html>
