<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Schema Generator Pro</title>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .section { padding: 20px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 20px; background: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .pick-grid { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 10px; background: #f1f3f4; padding: 10px; border-radius: 5px; margin-bottom: 5px; }
        label { font-weight: 600; font-size: 13px; color: #555; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 6px; box-sizing: border-box; }
        .hidden { display: none; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        #jsonOutput { background: #202124; color: #81c995; font-family: 'Consolas', monospace; padding: 20px; border-radius: 8px; width: 100%; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Schema Tool Pro</h1>

    <div class="section" style="background: #e8f0fe; border: 1px solid var(--primary);">
        <label>Select Schema Type:</label>
        <select id="schemaTypeSelect" onchange="switchSchema()">
            <option value="SportsEvent">Sports Event (Betting Picks)</option>
            <option value="FAQPage">FAQ Page</option>
            <option value="BlogPosting">Blog Posting</option>
            <option value="Review">Review</option>
        </select>
    </div>

    <form id="mainForm">
        <input type="hidden" name="schemaType" id="hiddenType" value="SportsEvent">

        <!-- SPORTS EVENT SECTION -->
        <div id="fields_SportsEvent">
            <div class="section">
                <h2>League & Teams</h2>
                <div class="grid">
                    <div>
                        <label>Sport/League:</label>
                        <select name="seSport" id="seSport" onchange="loadTeams()">
                            <option value="NFL">NFL</option>
                            <option value="NBA">NBA</option>
                            <option value="MLB">MLB</option>
                            <option value="NHL">NHL</option>
                            <option value="Other">Other (Custom)</option>
                        </select>
                    </div>
                    <div id="customL" class="hidden">
                        <label>Custom League & Sport:</label>
                        <div class="grid">
                            <input type="text" name="seLeagueCustom" placeholder="e.g. La Liga">
                            <input type="text" name="seSportCustom" placeholder="e.g. Soccer">
                        </div>
                    </div>
                </div>

                <div class="grid" style="margin-top:15px;">
                    <div>
                        <label>Home Team (Team A):</label>
                        <select name="seTeamA" id="seTeamA" onchange="autoFillVenue()"></select>
                        <input type="text" name="seTeamACustom" id="seTeamACustom" class="hidden" placeholder="Team A Name" oninput="updName()">
                    </div>
                    <div>
                        <label>Away Team (Team B):</label>
                        <select name="seTeamB" id="seTeamB" onchange="updName()"></select>
                        <input type="text" name="seTeamBCustom" id="seTeamBCustom" class="hidden" placeholder="Team B Name" oninput="updName()">
                    </div>
                </div>
                <label style="margin-top:15px;">Event Name:</label>
                <input type="text" name="seName" id="seName" placeholder="Auto-generated">
            </div>

            <div class="section">
                <h2>Venue, Status & SEO</h2>
                <div class="grid">
                    <div>
                        <label>Stadium:</label>
                        <input type="text" name="seStadium" id="seStadium" placeholder="Stadium Name">
                    </div>
                    <div>
                        <label>City:</label>
                        <input type="text" name="seCity" id="seCity" placeholder="City">
                    </div>
                    <div>
                        <label>Country:</label>
                        <input type="text" name="seCountry" id="seCountry" value="USA">
                    </div>
                </div>
                <div class="grid" style="margin-top:10px;">
                    <input type="datetime-local" name="seStartDate" title="Start Date">
                    <select name="seStatus">
                        <option value="http://schema.org/EventScheduled">Scheduled</option>
                        <option value="http://schema.org/EventCancelled">Cancelled</option>
                    </select>
                    <input type="text" name="seLang" value="en-US">
                </div>
                <textarea name="seDesc" placeholder="SEO Description..." style="margin-top:10px;"></textarea>
                <input type="url" name="seImage" placeholder="Featured Image URL">
            </div>

            <div class="section">
                <h2>Offers & 7 Picks</h2>
                <div class="pick-grid" style="background:#e8f0fe">
                    <input type="text" name="seOfferName" placeholder="Main Market">
                    <input type="text" name="seOfferPrice" placeholder="Odds">
                    <input type="url" name="seOfferUrl" placeholder="URL">
                </div>
                {% for i in range(1, 8) %}
                <div class="pick-grid">
                    <input type="text" name="pick{{i}}Name" placeholder="Pick {{i}}">
                    <input type="text" name="pick{{i}}Price" placeholder="Odds">
                    <input type="url" name="pick{{i}}Url" placeholder="URL">
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- FAQ, BLOG, REVIEW (Se mantienen igual) -->
        <div id="fields_FAQPage" class="hidden">
            <div class="section"><h2>FAQ</h2><input type="text" name="faqQ1" placeholder="Question"><textarea name="faqA1" placeholder="Answer"></textarea></div>
        </div>
        <div id="fields_BlogPosting" class="hidden">
            <div class="section"><h2>Blog</h2><input type="text" name="blogHeadline" placeholder="Headline"><input type="text" name="blogAuthor" placeholder="Author"><input type="url" name="blogUrl" placeholder="URL"></div>
        </div>
        <div id="fields_Review" class="hidden">
            <div class="section"><h2>Review</h2><input type="text" name="revItem" placeholder="Item"><input type="number" name="revValue" value="5"></div>
        </div>

        <button type="submit">Generate Professional Schema</button>
    </form>

    <textarea id="jsonOutput" rows="20" readonly></textarea>
</div>

    function switchSchema() {
        const type = document.getElementById('schemaTypeSelect').value;
        document.getElementById('hiddenType').value = type;
        ["SportsEvent", "FAQPage", "BlogPosting", "Review"].forEach(t => {
            document.getElementById(`fields_${t}`).classList.toggle('hidden', t !== type);
        });
    }

    function loadTeams() {
        const league = document.getElementById('seSport').value;
        const isOther = league === 'Other';
        
        document.getElementById('customL').classList.toggle('hidden', !isOther);
        document.getElementById('seTeamA').classList.toggle('hidden', isOther);
        document.getElementById('seTeamB').classList.toggle('hidden', isOther);
        document.getElementById('seTeamACustom').classList.toggle('hidden', !isOther);
        document.getElementById('seTeamBCustom').classList.toggle('hidden', !isOther);

        if(!isOther) {
            const teamNames = Object.keys(teamData[league] || {});
            const options = teamNames.map(t => `<option value="${t}">${t}</option>`).join('');
            document.getElementById('seTeamA').innerHTML = options;
            document.getElementById('seTeamB').innerHTML = options;
            autoFillVenue(); // Rellenar stadium al cambiar liga
        }
    }

   function autoFillVenue() {
    const league = document.getElementById('seSport').value;
    const homeTeam = document.getElementById('seTeamA').value;

    if (league !== 'Other' && teamData[league][homeTeam]) {
        const info = teamData[league][homeTeam];
        document.getElementById('seStadium').value = info.stadium;
        document.getElementById('seCity').value = info.city;
        document.getElementById('seRegion').value = info.region; // <--- ESTA LÍNEA ES NUEVA
        document.getElementById('seCountry').value = (league === "NHL" && info.region === "ON") ? "CA" : "US";
    }
    updName();
}

    function updName() {
        const league = document.getElementById('seSport').value;
        let a = (league === 'Other') ? document.getElementById('seTeamACustom').value : document.getElementById('seTeamA').value;
        let b = (league === 'Other') ? document.getElementById('seTeamBCustom').value : document.getElementById('seTeamB').value;
        document.getElementById('seName').value = a && b ? `${a} vs ${b}` : "";
    }

    document.getElementById('mainForm').onsubmit = async (e) => {
        e.preventDefault();
        const res = await fetch('/generate_schema', { method: 'POST', body: new FormData(e.target) });
        const json = await res.json();
        document.getElementById('jsonOutput').value = JSON.stringify(json, null, 2);
    };

    // Inicialización
    loadTeams();
