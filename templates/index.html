<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schema.org Generator - Pro Version</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1a73e8; margin-bottom: 30px; }
        .form-section { margin-bottom: 30px; padding: 25px; border: 1px solid #e0e0e0; border-radius: 8px; background-color: #ffffff; }
        .form-section h2 { margin-top: 0; color: #1a73e8; font-size: 1.2rem; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ced4da; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        input:focus { border-color: #1a73e8; outline: none; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .pick-grid { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 15px; padding: 15px; background: #f8f9fa; border-radius: 6px; margin-bottom: 10px; }
        button { width: 100%; padding: 15px; background-color: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #1557b0; }
        #jsonOutput { width: 100%; background: #202124; color: #34a853; font-family: 'Consolas', monospace; padding: 20px; border-radius: 6px; font-size: 14px; line-height: 1.5; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Schema.org Betting Generator</h1>

        <form id="schemaForm">
            <!-- SECCIÓN 1: EVENTO -->
            <div class="form-section">
                <h2>1. Event & League Details</h2>
                
                <label>League / Sport:</label>
                <select name="seSport" id="seSport" onchange="updateTeams()">
                    <option value="NFL">NFL (American Football)</option>
                    <option value="NBA">NBA (Basketball)</option>
                    <option value="MLB">MLB (Baseball)</option>
                    <option value="NHL">NHL (Ice Hockey)</option>
                    <option value="Other">Other (Custom)</option>
                </select>

                <!-- Campos para Ligas Personalizadas -->
                <div id="customLeagueDiv" class="hidden">
                    <div class="grid-3">
                        <div>
                            <label>Custom League Name:</label>
                            <input type="text" name="seLeagueCustom" placeholder="e.g. La Liga">
                        </div>
                        <div>
                            <label>Custom Sport Name:</label>
                            <input type="text" name="seSportCustom" placeholder="e.g. Soccer">
                        </div>
                    </div>
                </div>

                <label>Event Name:</label>
                <input type="text" name="seName" id="seName" placeholder="Auto-fills from teams..." required>

                <div class="grid-3">
                    <div>
                        <label>Home Team (Team A):</label>
                        <select name="seTeamA" id="seTeamA" onchange="syncEventName()"></select>
                        <input type="text" name="seTeamACustom" id="seTeamACustom" class="hidden" placeholder="Team A Name">
                    </div>
                    <div>
                        <label>Away Team (Team B):</label>
                        <select name="seTeamB" id="seTeamB" onchange="syncEventName()"></select>
                        <input type="text" name="seTeamBCustom" id="seTeamBCustom" class="hidden" placeholder="Team B Name">
                    </div>
                    <div>
                        <label>Language:</label>
                        <input type="text" name="seLanguage" value="en-US">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: LOCALIZACIÓN Y STATUS -->
            <div class="form-section">
                <h2>2. Venue & Status</h2>
                <div class="grid-3">
                    <input type="text" name="seStadium" placeholder="Stadium Name">
                    <input type="text" name="seCity" placeholder="City">
                    <input type="text" name="seCountry" placeholder="Country" value="USA">
                </div>
                <div class="grid-3">
                    <div>
                        <label>Start Date:</label>
                        <input type="datetime-local" name="seStartDate">
                    </div>
                    <div>
                        <label>Status:</label>
                        <select name="seEventStatus">
                            <option value="http://schema.org/EventScheduled">Scheduled</option>
                            <option value="http://schema.org/EventCancelled">Cancelled</option>
                        </select>
                    </div>
                    <div>
                        <label>SEO Image URL:</label>
                        <input type="url" name="seImage" placeholder="https://...">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 3: PICKS -->
            <div class="form-section">
                <h2>3. Main Offer & Additional Picks (1-7)</h2>
                <label>Main Offer (Market, Odds, URL):</label>
                <div class="pick-grid">
                    <input type="text" name="seOfferName" placeholder="Main Market (e.g. Moneyline)">
                    <input type="text" name="seOfferPrice" placeholder="Odds">
                    <input type="url" name="seOfferUrl" placeholder="URL">
                </div>

                <label>Additional Picks:</label>
                {% for i in range(1, 8) %}
                <div class="pick-grid">
                    <input type="text" name="pick{{i}}Name" placeholder="Pick {{i}} Name">
                    <input type="text" name="pick{{i}}Price" placeholder="Odds">
                    <input type="url" name="pick{{i}}Url" placeholder="URL">
                </div>
                {% endfor %}
            </div>

            <button type="submit">Generate Professional Schema</button>
        </form>

        <div class="form-section" style="margin-top: 30px;">
            <h2>JSON-LD Result:</h2>
            <textarea id="jsonOutput" rows="20" readonly></textarea>
            <button onclick="copyToClipboard()" style="background-color: #34a853; margin-top: 10px;">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        const teamsByLeague = {
            "NFL": ["Arizona Cardinals", "Atlanta Falcons", "Baltimore Ravens", "Buffalo Bills", "Carolina Panthers", "Chicago Bears", "Cincinnati Bengals", "Cleveland Browns", "Dallas Cowboys", "Denver Broncos", "Detroit Lions", "Green Bay Packers", "Houston Texans", "Indianapolis Colts", "Jacksonville Jaguars", "Kansas City Chiefs", "Las Vegas Raiders", "Los Angeles Chargers", "Los Angeles Rams", "Miami Dolphins", "Minnesota Vikings", "New England Patriots", "New Orleans Saints", "New York Giants", "New York Jets", "Philadelphia Eagles", "Pittsburgh Steelers", "San Francisco 49ers", "Seattle Seahawks", "Tampa Bay Buccaneers", "Tennessee Titans", "Washington Commanders"],
            "NBA": ["Atlanta Hawks", "Boston Celtics", "Brooklyn Nets", "Charlotte Hornets", "Chicago Bulls", "Cleveland Cavaliers", "Dallas Mavericks", "Denver Nuggets", "Detroit Pistons", "Golden State Warriors", "Houston Rockets", "Indiana Pacers", "LA Clippers", "Los Angeles Lakers", "Memphis Grizzlies", "Miami Heat", "Milwaukee Bucks", "Minnesota Timberwolves", "New Orleans Pelicans", "New York Knicks", "Oklahoma City Thunder", "Orlando Magic", "Philadelphia 76ers", "Phoenix Suns", "Portland Trail Blazers", "Sacramento Kings", "San Antonio Spurs", "Toronto Raptors", "Utah Jazz", "Washington Wizards"],
            "MLB": ["Arizona Diamondbacks", "Atlanta Braves", "Baltimore Orioles", "Boston Red Sox", "Chicago White Sox", "Chicago Cubs", "Cincinnati Reds", "Cleveland Guardians", "Colorado Rockies", "Detroit Tigers", "Houston Astros", "Kansas City Royals", "Los Angeles Angels", "Los Angeles Dodgers", "Miami Marlins", "Milwaukee Brewers", "Minnesota Twins", "New York Yankees", "New York Mets", "Oakland Athletics", "Philadelphia Phillies", "Pittsburgh Pirates", "San Diego Padres", "San Francisco Giants", "Seattle Mariners", "St. Louis Cardinals", "Tampa Bay Rays", "Texas Rangers", "Toronto Blue Jays", "Washington Nationals"],
            "NHL": ["Anaheim Ducks", "Arizona Coyotes", "Boston Bruins", "Buffalo Sabres", "Calgary Flames", "Carolina Hurricanes", "Chicago Blackhawks", "Colorado Avalanche", "Columbus Blue Jackets", "Dallas Stars", "Detroit Red Wings", "Edmonton Oilers", "Florida Panthers", "Los Angeles Kings", "Minnesota Wild", "Montreal Canadiens", "Nashville Predators", "New Jersey Devils", "New York Islanders", "New York Rangers", "Ottawa Senators", "Philadelphia Flyers", "Pittsburgh Penguins", "San Jose Sharks", "Seattle Kraken", "St. Louis Blues", "Tampa Bay Lightning", "Toronto Maple Leafs", "Vancouver Canucks", "Vegas Golden Knights", "Washington Capitals", "Winnipeg Jets"]
        };

        function updateTeams() {
            const league = document.getElementById('seSport').value;
            const teamASelect = document.getElementById('seTeamA');
            const teamBSelect = document.getElementById('seTeamB');
            const teamACustom = document.getElementById('seTeamACustom');
            const teamBCustom = document.getElementById('seTeamBCustom');
            const customDiv = document.getElementById('customLeagueDiv');

            if (league === 'Other') {
                teamASelect.classList.add('hidden');
                teamBSelect.classList.add('hidden');
                teamACustom.classList.remove('hidden');
                teamBCustom.classList.remove('hidden');
                customDiv.classList.remove('hidden');
            } else {
                teamASelect.classList.remove('hidden');
                teamBSelect.classList.remove('hidden');
                teamACustom.classList.add('hidden');
                teamBCustom.classList.add('hidden');
                customDiv.classList.add('hidden');

                teamASelect.innerHTML = teamsByLeague[league].map(t => `<option value="${t}">${t}</option>`).join('');
                teamBSelect.innerHTML = teamsByLeague[league].map(t => `<option value="${t}">${t}</option>`).join('');
            }
            syncEventName();
        }

        function syncEventName() {
            const league = document.getElementById('seSport').value;
            let a, b;
            if (league === 'Other') {
                a = document.getElementById('seTeamACustom').value;
                b = document.getElementById('seTeamBCustom').value;
            } else {
                a = document.getElementById('seTeamA').value;
                b = document.getElementById('seTeamB').value;
            }
            document.getElementById('seName').value = (a && b) ? `${a} vs ${b}` : "";
        }

        document.getElementById('schemaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('/generate_schema', { method: 'POST', body: new FormData(this) })
                .then(res => res.json())
                .then(data => document.getElementById('jsonOutput').value = JSON.stringify(data, null, 2));
        });

        function copyToClipboard() {
            const el = document.getElementById('jsonOutput');
            el.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }

        // Init
        updateTeams();
    </script>
</body>
</html>
