<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schema.org Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .hidden-fields {
      display: none;
    }
    #generatedSchemaOutput {
      white-space: pre-wrap;
      word-wrap: break-word;
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      padding: 15px;
      border-radius: 5px;
      max-height: 400px;
      overflow-y: auto;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4 text-center">Schema.org Generator</h1>
    <form id="schemaForm" method="POST" action="/generate_schema">
      <div class="mb-3">
        <label for="tipo" class="form-label">Select Schema Type:</label>
        <select class="form-select" id="tipo" name="tipo" required>
          <option value="">-- Select --</option>
          <option value="FAQPage">FAQPage</option>
          <option value="BlogPosting">BlogPosting</option>
          <option value="Review">Review (Betting Picks)</option>
        </select>
      </div>

      <!-- FAQ Schema Block -->
      <div id="faq-fields" class="schema-fields hidden-fields">
        <h2 class="mt-4 mb-3">FAQPage Schema Fields</h2>
        <div class="mb-3">
          <label for="faqAuthor" class="form-label">Author:</label>
          <input type="text" class="form-control" id="faqAuthor" name="faqAuthor" placeholder="John Doe" required />
        </div>
        <div class="mb-3">
          <label for="faqCreatedAt" class="form-label">Creation Date & Time:</label>
          <input type="datetime-local" class="form-control" id="faqCreatedAt" name="faqCreatedAt" required />
        </div>
        <div class="mb-3">
          <label for="faqModifiedAt" class="form-label">Modification Date & Time:</label>
          <input type="datetime-local" class="form-control" id="faqModifiedAt" name="faqModifiedAt" required />
        </div>

        <div id="faqQuestionsBlock">
          <div class="mb-3">
            <label for="faqQ1" class="form-label">Question 1:</label>
            <input type="text" class="form-control" id="faqQ1" name="faqQ1" placeholder="What is Schema.org?" required />
          </div>
          <div class="mb-3">
            <label for="faqA1" class="form-label">Answer 1:</label>
            <textarea class="form-control" id="faqA1" name="faqA1" rows="3" placeholder="Answer here..." required></textarea>
          </div>
          <div class="mb-3">
            <label for="faqQ2" class="form-label">Question 2:</label>
            <input type="text" class="form-control" id="faqQ2" name="faqQ2" placeholder="What is Schema.org?" required />
          </div>
          <div class="mb-3">
            <label for="faqA2" class="form-label">Answer 2:</label>
            <textarea class="form-control" id="faqA2" name="faqA2" rows="3" placeholder="Answer here..." required></textarea>
          </div>
          <div class="mb-3">
            <label for="faqQ3" class="form-label">Question 3:</label>
            <input type="text" class="form-control" id="faqQ3" name="faqQ3" placeholder="What is Schema.org?" required />
          </div>
          <div class="mb-3">
            <label for="faqA3" class="form-label">Answer 3:</label>
            <textarea class="form-control" id="faqA3" name="faqA3" rows="3" placeholder="Answer here..." required></textarea>
          </div>
          <div class="mb-3">
            <label for="faqQ4" class="form-label">Question 4:</label>
            <input type="text" class="form-control" id="faqQ4" name="faqQ4" placeholder="What is Schema.org?" />
          </div>
          <div class="mb-3">
            <label for="faqA4" class="form-label">Answer 4:</label>
            <textarea class="form-control" id="faqA4" name="faqA4" rows="3" placeholder="Answer here..."></textarea>
          </div>
        </div>
        <!-- Template block for FAQ suggestion -->
        <div id="faqTemplateFields" class="hidden-fields">
          <div class="mb-3">
            <label for="faqTitle" class="form-label">Title:</label>
            <input type="text" class="form-control" id="faqTitle" name="faqTitle" placeholder="Enter article title" />
          </div>
          <div class="mb-3">
            <label for="faqSummary" class="form-label">Summary:</label>
            <textarea class="form-control" id="faqSummary" name="faqSummary" rows="3" placeholder="Enter article summary"></textarea>
          </div>
          <div class="mb-3">
            <label for="faqKeywords" class="form-label">Keywords:</label>
            <input type="text" class="form-control" id="faqKeywords" name="faqKeywords" placeholder="Enter keywords to target" />
          </div>
          <input type="number" id="faqCount" name="faqCount" min="1" max="10" value="4" class="form-control" />
        </div>
        <button type="button" id="toggleFaqViewBtn" class="btn btn-secondary mb-3">
          Use Title, Summary & Keywords Template
        </button>
        <button type="button" id="generateFaqBtn" class="btn btn-info mb-3">
          Generate FAQ Suggestions
        </button>
      </div>

      <!-- BlogPosting Schema Block -->
      <div id="blogposting-fields" class="schema-fields hidden-fields">
        <h2 class="mt-4 mb-3">BlogPosting Schema Fields</h2>
        <div class="mb-3">
          <label for="blogTitle" class="form-label">Title:</label>
          <input type="text" class="form-control" id="blogTitle" name="blogTitle" placeholder="Blog Title" required />
        </div>
        <div class="mb-3">
          <label for="blogAuthor" class="form-label">Author:</label>
          <input type="text" class="form-control" id="blogAuthor" name="blogAuthor" placeholder="Author Name" required />
        </div>
        <div class="mb-3">
          <label for="blogPublicationDate" class="form-label">Publication Date:</label>
          <input type="date" class="form-control" id="blogPublicationDate" name="blogPublicationDate" required />
        </div>
        <div class="mb-3">
          <label for="blogImage" class="form-label">Image URL:</label>
          <input type="url" class="form-control" id="blogImage" name="blogImage" placeholder="https://example.com/image.jpg" />
        </div>
        <div class="mb-3">
          <label for="blogContent" class="form-label">Content:</label>
          <textarea class="form-control" id="blogContent" name="blogContent" rows="5" placeholder="Blog content here..."></textarea>
        </div>
        <h3 class="mt-4 mb-3">Sport Event Details (Optional)</h3>
        <input type="text" class="form-control mb-2" id="eventName" name="eventName" placeholder="Event Name" />
        <input type="datetime-local" class="form-control mb-2" id="eventStartDate" name="eventStartDate" />
        <input type="datetime-local" class="form-control mb-2" id="eventEndDate" name="eventEndDate" />
        <input type="text" class="form-control mb-2" id="eventLocation" name="eventLocation" placeholder="Location" />
        <input type="text" class="form-control mb-2" id="eventOrganizer" name="eventOrganizer" placeholder="Organizer" />
        <textarea class="form-control mb-2" id="eventDescription" name="eventDescription" rows="3" placeholder="Event Description"></textarea>
        <select class="form-select mb-2" id="eventStatus" name="eventStatus">
          <option value="">-- Select Status --</option>
          <option value="EventScheduled">Scheduled</option>
          <option value="EventCancelled">Cancelled</option>
          <option value="EventPostponed">Postponed</option>
          <option value="EventRescheduled">Rescheduled</option>
          <option value="EventMovedOnline">Moved Online</option>
        </select>
        <input type="url" class="form-control mb-2" id="eventImage" name="eventImage" placeholder="Event Image URL" />
        <input type="url" class="form-control mb-2" id="eventOffers" name="eventOffers" placeholder="Offers URL" />
        <input type="text" class="form-control mb-2" id="eventTeam1" name="eventTeam1" placeholder="Team 1" />
        <input type="text" class="form-control mb-2" id="eventTeam2" name="eventTeam2" placeholder="Team 2" />
      </div>

      <!-- Review Schema Block -->
      <div id="review-fields" class="schema-fields hidden-fields">
        <h2 class="mt-4 mb-3">Review Schema Fields (Betting Picks)</h2>
        <div class="mb-3">
          <label for="reviewAuthor" class="form-label">Author:</label>
          <input type="text" class="form-control" id="reviewAuthor" name="reviewAuthor" placeholder="Author Name" required />
        </div>
        <div class="mb-3">
          <label for="reviewPublicationDate" class="form-label">Publication Date:</label>
          <input type="date" class="form-control" id="reviewPublicationDate" name="reviewPublicationDate" required />
        </div>
        <div class="mb-3">
          <label for="reviewReasoning" class="form-label">Analysis / Reasoning:</label>
          <textarea class="form-control" id="reviewReasoning" name="reviewReasoning" rows="4" placeholder="Your analysis..." required></textarea>
        </div>
        <div class="mb-3">
          <label for="reviewRating" class="form-label">Rating / Confidence (1-5):</label>
          <input type="number" class="form-control" id="reviewRating" name="reviewRating" min="1" max="5" />
        </div>
        <div class="mb-3">
          <label for="reviewEventName" class="form-label">Event Name:</label>
          <input type="text" class="form-control" id="reviewEventName" name="reviewEventName" placeholder="Event Name" />
        </div>
        <div class="mb-3">
          <label for="reviewEventDate" class="form-label">Event Date:</label>
          <input type="date" class="form-control" id="reviewEventDate" name="reviewEventDate" />
        </div>
        <div class="mb-3">
          <label for="reviewEventLocation" class="form-label">Event Location:</label>
          <input type="text" class="form-control" id="reviewEventLocation" name="reviewEventLocation" placeholder="Location" />
        </div>
        <div class="mb-3">
          <label for="reviewMarketType" class="form-label">Market Type:</label>
          <input type="text" class="form-control" id="reviewMarketType" name="reviewMarketType" placeholder="Market Type" />
        </div>
        <div class="mb-3">
          <label for="reviewSelection" class="form-label">Selection:</label>
          <input type="text" class="form-control" id="reviewSelection" name="reviewSelection" placeholder="Selection" />
        </div>
        <div class="mb-3">
          <label for="reviewOdds" class="form-label">Odds / Quote:</label>
          <input type="text" class="form-control" id="reviewOdds" name="reviewOdds" placeholder="Odds" />
        </div>
        <div class="mb-3">
          <label for="reviewBookmaker" class="form-label">Bookmaker:</label>
          <input type="text" class="form-control" id="reviewBookmaker" name="reviewBookmaker" placeholder="Bookmaker" />
        </div>
        <div class="mb-3">
          <label for="reviewUnits" class="form-label">Units / Risk:</label>
          <input type="number" class="form-control" id="reviewUnits" name="reviewUnits" step="0.5" placeholder="Units / Risk" />
        </div>
      </div>
      <div class="d-grid gap-2 mt-4">
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" value="yes" id="wrapScriptTag" name="wrapScriptTag" />
          <label class="form-check-label" for="wrapScriptTag">
            Wrap output in &lt;script type="application/ld+json"&gt; tags
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" id="generateSchemaBtn">Generate Schema</button>
      </div>
    </form>
    <div class="mt-4">
      <h3>Generated Schema.org JSON-LD:</h3>
      <div class="mb-2">
        <button id="copyBtn" class="btn btn-success mb-2">Copy to Clipboard</button>
        <span id="copyFeedback" style="display:none; color:green; margin-left:10px;">Copied!</span>
      </div>
      <pre id="generatedSchemaOutput"></pre>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- VISIBILIDAD DINÁMICA Y CAMPOS REQUIRED -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const schemaTypeSelect = document.getElementById('tipo');
      const faqPageFields = document.getElementById('faq-fields');
      const blogPostingFields = document.getElementById('blogposting-fields');
      const reviewFields = document.getElementById('review-fields');
      const faqQuestionsBlock = document.getElementById('faqQuestionsBlock');
      const faqTemplateBlock = document.getElementById('faqTemplateFields');
      const toggleFaqBtn = document.getElementById('toggleFaqViewBtn');

      function toggleSchemaFields() {
        faqPageFields.classList.add('hidden-fields');
        blogPostingFields.classList.add('hidden-fields');
        reviewFields.classList.add('hidden-fields');
        const selectedType = schemaTypeSelect.value;
        if (selectedType === 'FAQPage') {
          faqPageFields.classList.remove('hidden-fields');
        } else if (selectedType === 'BlogPosting') {
          blogPostingFields.classList.remove('hidden-fields');
        } else if (selectedType === 'Review') {
          reviewFields.classList.remove('hidden-fields');
        }
        localStorage.setItem('selectedSchemaType', selectedType);
        updateRequiredFields();
      }
      
      function updateRequiredFields() {
        [faqPageFields, blogPostingFields, reviewFields].forEach(group => {
          if (group) group.querySelectorAll('input, textarea').forEach(el => el.required = false);
        });
        if (faqTemplateBlock) faqTemplateBlock.querySelectorAll('input, textarea').forEach(el => el.required = false);

        const selectedType = schemaTypeSelect.value;
        if (selectedType === 'FAQPage' && !faqPageFields.classList.contains('hidden-fields')) {
          if (!faqQuestionsBlock.classList.contains('hidden-fields')) {
            faqQuestionsBlock.querySelectorAll('input, textarea').forEach(el => {
              if (el.getAttribute('required') !== null) el.required = true;
            });
          }
          if (!faqTemplateBlock.classList.contains('hidden-fields')) {
            faqTemplateBlock.querySelectorAll('input, textarea').forEach(el => {
              if (el.getAttribute('required') !== null) el.required = true;
            });
          }
        }
        if (selectedType === 'BlogPosting' && !blogPostingFields.classList.contains('hidden-fields')) {
          blogPostingFields.querySelectorAll('input, textarea').forEach(el => {
            if (el.getAttribute('required') !== null) el.required = true;
          });
        }
        if (selectedType === 'Review' && !reviewFields.classList.contains('hidden-fields')) {
          reviewFields.querySelectorAll('input, textarea').forEach(el => {
            if (el.getAttribute('required') !== null) el.required = true;
          });
        }
      }

      schemaTypeSelect.addEventListener('change', toggleSchemaFields);

      const savedSelectedType = localStorage.getItem('selectedSchemaType');
      if (savedSelectedType) {
        schemaTypeSelect.value = savedSelectedType;
      }

      toggleSchemaFields();

      // Alternar entre preguntas individuales y template FAQ AI
      if (toggleFaqBtn) {
        toggleFaqBtn.addEventListener('click', function () {
          if (faqTemplateBlock.classList.contains('hidden-fields')) {
            faqTemplateBlock.classList.remove('hidden-fields');
            faqQuestionsBlock.classList.add('hidden-fields');
            toggleFaqBtn.textContent = 'Use Individual Questions';
          } else {
            faqTemplateBlock.classList.add('hidden-fields');
            faqQuestionsBlock.classList.remove('hidden-fields');
            toggleFaqBtn.textContent = 'Use Title, Summary & Keywords Template';
          }
          setTimeout(updateRequiredFields, 100);
        });
      }
    });
  </script>
</body>
</html>
