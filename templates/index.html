<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schema Tool Pro - Functional Master</title>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .section { padding: 20px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 20px; background: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .pick-grid { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 10px; background: #f1f3f4; padding: 10px; border-radius: 5px; margin-bottom: 5px; }
        label { font-weight: 600; font-size: 13px; color: #555; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 6px; box-sizing: border-box; }
        .hidden { display: none !important; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        #jsonOutput, #visualOutput { background: #202124; color: #81c995; font-family: 'Consolas', monospace; padding: 20px; border-radius: 8px; width: 100%; margin-top: 5px; font-size: 14px; }
        #visualOutput { background: #f1f8ff; color: #1a73e8; }
        .btn-widget { background-color: #6366f1 !important; }
        .btn-widget:hover { background-color: #4f46e5 !important; }
        .remove-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; width: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>Schema Tool Pro</h1>

    <!-- TABS DROPDOWN -->
    <div class="section" style="background: #e8f0fe; border: 1px solid var(--primary);">
        <label>Select Schema Type:</label>
        <select id="schemaTypeSelect" onchange="switchSchema()">
            <option value="SportsEvent">Sports Event (Betting Picks)</option>
            <option value="Parlay">Parlay (SGP & CGP)</option>
            <option value="FAQPage">FAQ Page</option>
            <option value="BlogPosting">Blog Posting</option>
            <option value="Review">Review</option>
            <option value="Takeaways">Key Takeaways (Widget + Schema)</option>
            <option value="WidgetSingle">Widget: Single Matchup</option>
            <option value="WidgetMulti">Widget: Multi-Matchup</option>
        </select>
    </div>

    <form id="mainForm">
        <input type="hidden" name="schemaType" id="hiddenType" value="SportsEvent">

        <!-- SPORTS EVENT SECTION -->
        <div id="fields_SportsEvent">
            <div class="section">
                <h2>League & Teams</h2>
                <div class="grid">
                    <div>
                        <label>Sport/League:</label>
                        <select name="seSport" id="seSport" onchange="loadTeams()">
                            <option value="NFL">NFL</option>
                            <option value="NBA">NBA</option>
                            <option value="MLB">MLB</option>
                            <option value="NHL">NHL</option>
                            <option value="Other">Other (Custom)</option>
                        </select>
                    </div>
                    <div id="customL" class="hidden">
                        <label>Custom League & Sport:</label>
                        <div class="grid">
                            <input type="text" name="seLeagueCustom" placeholder="e.g. La Liga">
                            <input type="text" name="seSportCustom" placeholder="e.g. Soccer">
                        </div>
                    </div>
                </div>

                <div class="grid" style="margin-top:15px;">
                    <div>
                        <label>Home Team:</label>
                        <select name="seTeamA" id="seTeamA" onchange="autoFillVenue()"></select>
                        <input type="text" name="seTeamACustom" id="seTeamACustom" class="hidden" placeholder="Home Team" oninput="updName()">
                    </div>
                    <div>
                        <label>Away Team:</label>
                        <select name="seTeamB" id="seTeamB" onchange="updName()"></select>
                        <input type="text" name="seTeamBCustom" id="seTeamBCustom" class="hidden" placeholder="Away Team" oninput="updName()">
                    </div>
                </div>
                <label style="margin-top:15px;">Event Name:</label>
                <input type="text" name="seName" id="seName">
            </div>

            <div class="section">
                <h2>Venue & Timing</h2>
                <div class="grid">
                    <div><label>Stadium:</label><input type="text" name="seStadium" id="seStadium"></div>
                    <div><label>City:</label><input type="text" name="seCity" id="seCity"></div>
                    <div><label>Region/State:</label><input type="text" name="seRegion" id="seRegion"></div>
                    <div><label>Country:</label><input type="text" name="seCountry" id="seCountry" value="US"></div>
                </div>
                <div class="grid" style="margin-top:15px;">
                    <div><label>Start Date:</label><input type="datetime-local" name="seStartDate" id="seStartDate"></div>
                    <div><label>End Date:</label><input type="datetime-local" name="seEndDate" id="seEndDate"></div>
                    <div><label>Valid From:</label><input type="datetime-local" name="seValidFrom"></div>
                </div>
            </div>

            <div class="section">
                <h2>Offers & Additional Picks</h2>
                <label>Main Market:</label>
                <div class="pick-grid" style="background:#e8f0fe; border-left: 4px solid #1a73e8;">
                    <input type="text" name="seOfferName" placeholder="Market (e.g. Moneyline)">
                    <input type="text" name="seOfferPrice" placeholder="Odds">
                    <input type="url" name="seOfferUrl" placeholder="URL">
                </div>
                <div id="sportsPicksContainer" style="margin-top:15px;"></div>
                <button type="button" onclick="addSportsPick()" style="background:#34a853; width: auto; padding: 10px 20px;">+ Add Another Pick</button>
            </div>
        </div>

        <!-- PARLAY SECTION -->
        <div id="fields_Parlay" class="hidden">
            <div class="section" style="background:#fff4e5;">
                <h2>Parlay Master Details</h2>
                <div class="grid">
                    <input type="text" name="parlayName" placeholder="Parlay Title">
                    <input type="text" name="parlayTotalOdds" placeholder="Total Odds (+850)">
                    <input type="url" name="parlayUrl" placeholder="URL">
                </div>
                <textarea name="parlayDesc" placeholder="Description..." style="margin-top:10px;"></textarea>
            </div>
            <div class="section">
                <h2>Parlay Legs</h2>
                <div id="parlayLegsContainer"></div>
                <button type="button" onclick="addParlayLeg()" style="background:#ff9800; width:auto;">+ Add Leg</button>
            </div>
        </div>

        <!-- FAQ SECTION -->
        <div id="fields_FAQPage" class="hidden">
            <div class="section" style="background: #f9f9f9;">
                <h2>FAQ Page Details</h2>
                <div id="faqContainer"></div>
                <button type="button" onclick="addFAQ()" style="background:#ff9800; width:auto;">+ Add Question</button>
            </div>
        </div>

        <!-- TAKEAWAYS SECTION -->
        <div id="fields_Takeaways" class="hidden">
            <div class="section" style="background: #f8fafc; border: 1px solid #013369;">
                <h2>💡 Key Takeaways Generator</h2>
                <div class="grid">
                    <select name="tkIcon" id="tk-icon">
                        <option value="💡">💡 General</option>
                        <option value="🏎️">🏎️ F1</option>
                        <option value="🏀">🏀 NBA</option>
                        <option value="🏈">🏈 NFL</option>
                    </select>
                    <input type="text" name="tkTheme" placeholder="Article Theme">
                </div>
                <div id="tkContainer" style="margin-top:15px;"></div>
                <button type="button" onclick="addTakeaway()" style="background:#013369; width:auto;">+ Add Point</button>
            </div>
        </div>

        <!-- WIDGETS SECTIONS -->
        <div id="fields_WidgetSingle" class="hidden">
            <div class="section" style="background:#fffbeb;">
                <h2>Single Widget Details</h2>
                <div class="grid">
                    <input type="text" id="ws_promoTitle" placeholder="Promo Title">
                    <input type="text" id="ws_promoText" placeholder="Promo Text">
                    <input type="url" id="ws_promoUrl" placeholder="Promo Link">
                    <input type="url" id="ws_bookieUrl" placeholder="Bookie Link">
                </div>
                <div id="ws_rowsContainer" style="margin-top:15px;"></div>
                <button type="button" onclick="addWidgetRow('ws_rowsContainer', 'single')" style="background:#ff9800; width:auto;">+ Add Row</button>
            </div>
        </div>

        <div id="fields_WidgetMulti" class="hidden">
            <div class="section">
                <h2>Multi Matchup Details</h2>
                <div class="grid">
                    <input type="text" id="wm_promoTitle" placeholder="Promo Title">
                    <input type="text" id="wm_promoText" placeholder="Promo Text">
                    <input type="url" id="wm_promoUrl" placeholder="Promo Link">
                </div>
                <div id="wm_rowsContainer" style="margin-top:15px;"></div>
                <button type="button" onclick="addWidgetRow('wm_rowsContainer', 'multi')" style="background:#ff9800; width:auto;">+ Add Matchup</button>
            </div>
        </div>

        <!-- BLOG & REVIEW REMAINING (Simplified for length) -->
        <div id="fields_BlogPosting" class="hidden"><div class="section"><h2>Blog Posting</h2><input type="text" name="blogHeadline" placeholder="Headline"><textarea name="blogDesc" placeholder="Description"></textarea><input type="text" name="blogAuthor" placeholder="Author"><input type="url" name="blogUrl" placeholder="URL"><input type="url" name="blogImage" placeholder="Image URL"></div></div>
        <div id="fields_Review" class="hidden"><div class="section"><h2>Review</h2><input type="text" name="revItem" placeholder="Item"><input type="number" name="revValue" value="5"><textarea name="revBody" placeholder="Review Text"></textarea></div></div>

        <button type="submit" id="submitBtn" class="btn-widget">Generate Schema / Widget</button>
    </form>

    <div id="previewSection" class="hidden" style="margin-top: 30px; padding: 20px; border: 2px dashed #cbd5e1; border-radius: 12px; background: #f1f5f9;">
        <h3 style="text-align: center; color: #64748b; margin-top: 0; font-size: 14px;">Live Preview</h3>
        <div id="livePreview"></div>
    </div>

    <!-- RESULTS AREA -->
    <div id="result-container" style="margin-top: 20px;">
        <div id="visual-result-box" class="hidden">
            <label style="color:#1a73e8; font-weight:800;">📦 WIDGET CODE (Paste at Top):</label>
            <textarea id="visualOutput" rows="8" readonly></textarea>
            <button type="button" onclick="copyResult('visualOutput')" style="background:#1a73e8; margin-bottom:20px;">Copy Widget</button>
        </div>
        <div id="schema-result-box">
            <label style="color:#34a853; font-weight:800;">📜 SEO SCHEMA (Paste at Bottom):</label>
            <textarea id="jsonOutput" rows="10" readonly></textarea>
            <button type="button" onclick="copyResult('jsonOutput')" style="background:#34a853;">Copy Schema</button>
        </div>
    </div>

    <button type="button" onclick="clearForm()" style="background:#dc3545; margin-top:20px;">Clear All Fields</button>
</div>

<script>
    // 1. DATA & VARIABLES
    let sportsPickCount = 0, parlayPickCount = 0, faqCount = 0, tkCount = 0;
    const teamData = {
        "NFL": { "Arizona Cardinals": { stadium: "State Farm Stadium", city: "Glendale", region: "AZ" }, "Kansas City Chiefs": { stadium: "Arrowhead Stadium", city: "Kansas City", region: "MO" } },
        "NBA": { "Los Angeles Lakers": { stadium: "Crypto Arena", city: "Los Angeles", region: "CA" }, "Boston Celtics": { stadium: "TD Garden", city: "Boston", region: "MA" } },
        "MLB": { "NY Yankees": { stadium: "Yankee Stadium", city: "Bronx", region: "NY" } },
        "NHL": { "Florida Panthers": { stadium: "Amerant Arena", city: "Sunrise", region: "FL" } }
    };

    // 2. INTERFACE LOGIC
    function switchSchema() {
        const type = document.getElementById('schemaTypeSelect').value;
        document.getElementById('hiddenType').value = type;
        const schemas = ["SportsEvent", "FAQPage", "BlogPosting", "Review", "Parlay", "WidgetSingle", "WidgetMulti", "Takeaways"];
        schemas.forEach(s => {
            const div = document.getElementById(`fields_${s}`);
            if (div) div.classList.toggle('hidden', s !== type);
        });
        if (type === 'SportsEvent') loadTeams();
    }

    function loadTeams() {
        const league = document.getElementById('seSport').value;
        const isOther = (league === 'Other');
        document.getElementById('customL').classList.toggle('hidden', !isOther);
        const sA = document.getElementById('seTeamA'), sB = document.getElementById('seTeamB');
        const cA = document.getElementById('seTeamACustom'), cB = document.getElementById('seTeamBCustom');
        sA.classList.toggle('hidden', isOther); sB.classList.toggle('hidden', isOther);
        cA.classList.toggle('hidden', !isOther); cB.classList.toggle('hidden', !isOther);
        if (!isOther && teamData[league]) {
            const opts = Object.keys(teamData[league]).map(t => `<option value="${t}">${t}</option>`).join('');
            sA.innerHTML = opts; sB.innerHTML = opts;
        }
        autoFillVenue();
    }

    function autoFillVenue() {
        const league = document.getElementById('seSport').value;
        const home = document.getElementById('seTeamA').value;
        if (league !== 'Other' && teamData[league] && teamData[league][home]) {
            const info = teamData[league][home];
            document.getElementById('seStadium').value = info.stadium;
            document.getElementById('seCity').value = info.city;
            document.getElementById('seRegion').value = info.region;
        }
        updName();
    }

    function updName() {
        const isOther = document.getElementById('seSport').value === 'Other';
        const a = isOther ? document.getElementById('seTeamACustom').value : document.getElementById('seTeamA').value;
        const b = isOther ? document.getElementById('seTeamBCustom').value : document.getElementById('seTeamB').value;
        document.getElementById('seName').value = (a && b) ? `${a} vs ${b}` : "";
    }

    // 3. DYNAMIC FORM ADDERS
    function addFAQ() {
        faqCount++;
        const html = `<div class="faq-item" style="border-bottom:1px solid #ddd; padding:10px 0;"><strong>Q #${faqCount}</strong><button type="button" onclick="this.parentElement.remove(); reindexFAQ();" class="remove-btn" style="float:right;">✕</button><input type="text" class="faq-q" name="faqQ${faqCount}" placeholder="Question"><textarea class="faq-a" name="faqA${faqCount}" placeholder="Answer" style="height:60px;"></textarea></div>`;
        document.getElementById('faqContainer').insertAdjacentHTML('beforeend', html);
    }
    function reindexFAQ() {
        document.querySelectorAll('.faq-item').forEach((item, i) => {
            const n = i + 1;
            item.querySelector('strong').innerText = `Q #${n}`;
            item.querySelector('.faq-q').name = `faqQ${n}`;
            item.querySelector('.faq-a').name = `faqA${n}`;
        });
        faqCount = document.querySelectorAll('.faq-item').length;
    }

    function addTakeaway() {
        if (tkCount >= 6) return alert("Max reached");
        tkCount++;
        const html = `<div class="tk-item" style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:15px; margin-bottom:15px;"><div style="display:flex; justify-content:space-between; margin-bottom:10px;"><strong>Key Point #${tkCount}</strong><button type="button" onclick="this.closest('.tk-item').remove(); reindexTK();" class="remove-btn">Remove</button></div><textarea class="tk-in" name="tkPoint${tkCount}" style="height:80px;" placeholder="Point details..."></textarea></div>`;
        document.getElementById('tkContainer').insertAdjacentHTML('beforeend', html);
    }
    function reindexTK() {
        document.querySelectorAll('.tk-item').forEach((el, i) => {
            const n = i+1;
            el.querySelector('strong').innerText = `Key Point #${n}`;
            el.querySelector('textarea').name = `tkPoint${n}`;
        });
        tkCount = document.querySelectorAll('.tk-item').length;
    }

    function addSportsPick() {
        if (sportsPickCount >= 7) return alert("Max reached");
        sportsPickCount++;
        const html = `<div class="sp-row pick-grid" style="margin-bottom:10px; padding:10px; border-left:4px solid #34a853;"><input type="text" class="sp-n" name="pick${sportsPickCount}Name" placeholder="Name"><input type="text" class="sp-p" name="pick${sportsPickCount}Price" placeholder="Odds"><div style="display:flex; gap:8px;"><input type="url" class="sp-u" name="pick${sportsPickCount}Url" placeholder="URL" style="flex:1;"><button type="button" onclick="this.closest('.sp-row').remove(); reindexSP();" class="remove-btn">✕</button></div></div>`;
        document.getElementById('sportsPicksContainer').insertAdjacentHTML('beforeend', html);
    }
    function reindexSP() {
        document.querySelectorAll('.sp-row').forEach((row, i) => {
            const n = i+1;
            row.querySelector('.sp-n').name = `pick${n}Name`;
            row.querySelector('.sp-p').name = `pick${n}Price`;
            row.querySelector('.sp-u').name = `pick${n}Url`;
        });
        sportsPickCount = document.querySelectorAll('.sp-row').length;
    }

    function addParlayLeg() {
        parlayPickCount++;
        const html = `<div class="p-leg section" style="border-left:4px solid #ff9800; background:#fffcf9; margin-bottom:15px; padding:10px;"><div style="display:flex; justify-content:space-between; margin-bottom:5px;"><strong>Leg #${parlayPickCount}</strong><button type="button" onclick="this.closest('.p-leg').remove(); reindexPL();" class="remove-btn">✕</button></div><div class="grid"><input type="text" class="pl-e" name="pPick${parlayPickCount}Event" placeholder="Event"><input type="text" class="pl-n" name="pPick${parlayPickCount}Name" placeholder="Pick"><input type="text" class="pl-p" name="pPick${parlayPickCount}Price" placeholder="Odds"></div></div>`;
        document.getElementById('parlayLegsContainer').insertAdjacentHTML('beforeend', html);
    }
    function reindexPL() {
        document.querySelectorAll('.p-leg').forEach((leg, i) => {
            const n = i+1; leg.querySelector('strong').innerText = `Leg #${n}`;
            leg.querySelector('.pl-e').name = `pPick${n}Event`; leg.querySelector('.pl-n').name = `pPick${n}Name`; leg.querySelector('.pl-p').name = `pPick${n}Price`;
        });
        parlayPickCount = document.querySelectorAll('.p-leg').length;
    }

    function addWidgetRow(containerId, type) {
        const container = document.getElementById(containerId);
        const rowClass = type === 'single' ? 'widget-row-single' : 'widget-row-multi';
        const html = `<div class="section ${rowClass}" style="border-left:4px solid #6366f1; background:#f5f6ff; margin-bottom:15px; padding:10px;"><div style="display:flex; justify-content:space-between; margin-bottom:5px;"><strong>#</strong><button type="button" onclick="this.closest('.section').remove();" class="remove-btn">✕</button></div><div class="grid">${type === 'single' ? `<input type="text" class="ws_market" placeholder="Market"><input type="text" class="ws_pick" placeholder="Odds"><input type="url" class="ws_url" placeholder="Link">` : `<input type="text" class="wm_match" placeholder="Matchup"><input type="text" class="wm_pick" placeholder="Pick"><input type="url" class="wm_url" placeholder="Link">`}</div></div>`;
        container.insertAdjacentHTML('beforeend', html);
    }

    // 4. WIDGET CONSTRUCTORS
    function buildSingleWidgetHTML() {
        const title = document.getElementById('ws_promoTitle').value || "Bonus", text = document.getElementById('ws_promoText').value || "Offer", pUrl = document.getElementById('ws_promoUrl').value || "#", bUrl = document.getElementById('ws_bookieUrl').value || "#";
        let rows = '';
        document.querySelectorAll('.widget-row-single').forEach(r => {
            const m = r.querySelector('.ws_market').value, p = r.querySelector('.ws_pick').value, u = r.querySelector('.ws_url').value;
            if(m || p) rows += `<div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px dashed #eef2f7;"><span style="color:#64748b; font-size:11px; text-transform:uppercase; font-weight:800; flex:0 0 90px;">${m}</span><a href="${u}" style="color:#2563eb; text-decoration:none; font-size:14px; font-weight:700; text-align:right; flex:1;">${p}</a></div>`;
        });
        return `<div style="font-family:'Segoe UI',Arial,sans-serif; border:1px solid #e5e7eb; border-radius:14px; overflow:hidden; margin:20px 0; box-shadow:0 6px 18px rgba(15,23,42,0.08); width:100%; box-sizing:border-box; background-color:#fff;"><div style="padding:16px 18px; background:linear-gradient(180deg,#fff8db 0%,#fffdf4 100%); border-bottom:1px solid #f3e8a7; text-align:center;"><div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:8px;"><span style="font-size:20px; line-height:1;">🎁</span><span style="font-size:10px; color:#b45309; font-weight:800; text-transform:uppercase; letter-spacing:1px;">${title}</span></div><div style="font-size:15px; line-height:1.45; color:#7c2d12; font-weight:700; margin-bottom:14px;">${text}</div><a href="${pUrl}" style="display:flex; align-items:center; justify-content:center; background-color:#d4af37; color:#111827; padding:10px 16px; border-radius:8px; font-size:12px; font-weight:800; text-decoration:none; text-transform:uppercase; min-width:140px; margin:0 auto; line-height:1; min-height:36px;">ENTER NOW</a></div><div style="padding:14px 18px; background:#fff;"><div style="font-size:11px; color:#64748b; font-weight:800; text-transform:uppercase; letter-spacing:1.4px; text-align:center; padding-bottom:10px; margin-bottom:12px; border-bottom:1px solid #eef2f7;">Today's Expert Predictions</div>${rows}</div><div style="padding:12px 18px 18px 18px; text-align:center;"><a href="${bUrl}" style="display:flex; align-items:center; justify-content:center; background-color:#1e293b; color:#fff; padding:12px 16px; border-radius:10px; font-size:12px; font-weight:800; text-decoration:none; text-transform:uppercase; box-shadow:0 4px 10px rgba(15,23,42,0.15); max-width:240px; margin:0 auto; line-height:1; min-height:44px;">Place Your Bets at BetUS</a><p style="font-size:9px; color:#94a3b8; margin:10px 0 0 0; line-height:1.3;">18+ Only. Review T&Cs. <strong>Play Responsibly.</strong></p></div></div>`;
    }

    function buildMultiWidgetHTML() {
        const title = document.getElementById('wm_promoTitle').value || "Bonus", text = document.getElementById('wm_promoText').value || "Offer", pUrl = document.getElementById('wm_promoUrl').value || "#";
        let rows = '';
        document.querySelectorAll('.widget-row-multi').forEach(r => {
            const m = r.querySelector('.wm_match').value, p = r.querySelector('.wm_pick').value, u = r.querySelector('.wm_url').value;
            if(m || p) rows += `<div style="display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #eef2f7;"><div style="text-align:left; flex:1;"><div style="font-size:10px; color:#94a3b8; font-weight:800; text-transform:uppercase; letter-spacing:.8px; margin-bottom:4px;">${m}</div><div style="font-size:14px; color:#1e293b; font-weight:500;">Bet on: <strong style="color:#0f172a; font-weight:800;">${p}</strong></div></div><a href="${u}" style="display:inline-block; background-color:#1e293b; color:#fff; padding:10px 24px; border-radius:8px; font-size:12px; font-weight:700; text-decoration:none; text-transform:uppercase; white-space:nowrap;">Bet Now</a></div>`;
        });
        return `<div style="font-family:'Segoe UI',Arial,sans-serif; border:1px solid #e5e7eb; border-radius:16px; overflow:hidden; margin:20px 0; box-shadow:0 10px 25px -5px rgba(0,0,0,0.05); width:100%; box-sizing:border-box; background-color:#fff;"><div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%); border-bottom:1px solid #fde68a; text-align:center;"><div style="display:flex; align-items:center; margin-bottom:6px;"><span style="font-size:20px; margin-right:8px;">🎁</span><span style="font-size:10px; color:#b45309; font-weight:800; text-transform:uppercase;">${title}</span></div><div style="font-size:18px; color:#92400e; font-weight:800; margin-bottom:12px;">${text}</div><a href="${pUrl}" style="background-color:#d4af37; color:#1a1a1a; padding:10px 40px; border-radius:10px; font-size:13px; font-weight:800; text-decoration:none; text-transform:uppercase;">Claim Bonus</a></div><div style="background-color:#f8fafc; padding:10px; text-align:center; border-bottom:1px solid #f1f5f9;"><span style="font-size:11px; color:#64748b; font-weight:700; text-transform:uppercase; letter-spacing:1.5px;">🔥 Today's Top Expert Picks</span></div><div style="padding:0 20px;">${rows}</div><div style="background-color:#f8fafc; padding:12px; text-align:center;"><p style="font-size:10px; color:#94a3b8; margin:0; line-height:1.4;">18+ Only. Review T&Cs. <strong>Play Responsibly.</strong></p></div></div>`;
    }

    // 5. SUBMIT HANDLER
    document.getElementById('mainForm').onsubmit = async (e) => {
        e.preventDefault();
        const type = document.getElementById('schemaTypeSelect').value;
        const vBox = document.getElementById('visual-result-box'), sBox = document.getElementById('schema-result-box');
        const vOut = document.getElementById('visualOutput'), sOut = document.getElementById('jsonOutput');

        try {
            if (type.includes('Widget')) {
                const html = (type === 'WidgetSingle') ? buildSingleWidgetHTML() : buildMultiWidgetHTML();
                vOut.value = html;
                vBox.classList.remove('hidden'); sBox.classList.add('hidden');
                document.getElementById('livePreview').innerHTML = html;
                document.getElementById('previewSection').classList.remove('hidden');
            } else {
                const res = await fetch('/generate_schema', { method: 'POST', body: new FormData(e.target) });
                const data = await res.json();
                const schemaFinal = (type === 'Takeaways') ? data.schema : data;
                if (type === 'Takeaways') {
                    vOut.value = data.visual;
                    vBox.classList.remove('hidden');
                    document.getElementById('livePreview').innerHTML = data.visual;
                    document.getElementById('previewSection').classList.remove('hidden');
                } else {
                    vBox.classList.add('hidden'); previewSection.classList.add('hidden');
                }
                sOut.value = `<script type="application/ld+json">\n${JSON.stringify(schemaFinal, null, 2)}\n<\/script>`;
                sBox.classList.remove('hidden');
            }
        } catch (err) { alert("Error: " + err.message); }
    };

    function copyResult(id) { const el = document.getElementById(id); el.select(); document.execCommand('copy'); alert("Copied! ✅"); }
    function clearForm() { if (confirm("Clear all?")) location.reload(); }

    window.onload = () => {
        switchSchema();
        addFAQ(); addTakeaway(); addSportsPick(); addParlayLeg();
        addWidgetRow('ws_rowsContainer', 'single'); addWidgetRow('wm_rowsContainer', 'multi');
    };
</script>
</body>
</html>
